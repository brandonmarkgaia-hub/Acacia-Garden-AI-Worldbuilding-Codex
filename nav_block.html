  <script>
    (function () {
      // Compute prefix from current path depth so nav works from subfolders.
      // Example: /ACACIA_LOGS/index.html => prefix "../"
      const path = location.pathname || "";
      const parts = path.split("/").filter(Boolean);
      const depth = Math.max(0, parts.length - 2); // file depth
      const prefix = depth ? "../".repeat(depth) : "";

      const links = document.querySelectorAll(".ag-nav a[data-href]");
      links.forEach(a => {
        const href = a.getAttribute("data-href");
        a.setAttribute("href", prefix + href);

        // highlight current
        const normalized = (prefix + href).replace(/\/+/g, "/");
        const current = (location.pathname || "").replace(/\/+/g, "/");
        if (current.endsWith("/" + href) || current.endsWith(normalized)) {
          a.classList.add("ag-nav-current");
        }
      });
    })();
  </script>
