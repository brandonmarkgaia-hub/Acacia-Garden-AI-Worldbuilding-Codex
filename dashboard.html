<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ACACIA · COMMAND DECK · HKX277206</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050505;
      --void: #020202;
      --glass: rgba(20, 30, 40, 0.7);
      --glass-border: rgba(46, 204, 113, 0.15);
      --neon-green: #2ecc71;
      --neon-blue: #3498db;
      --neon-purple: #9b59b6;
      --platinum: #e5e4e2;
      --alert: #e74c3c;
      --font-mono: 'JetBrains Mono', monospace;
      --font-ui: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--platinum);
      font-family: var(--font-ui);
      margin: 0;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- THE DATA RAIN (BACKGROUND) --- */
    .rain-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      opacity: 0.15;
      pointer-events: none;
      background: radial-gradient(circle at 50% 100%, #1a2a1a 0%, #000000 70%);
    }

    /* --- THE TREE VISUALIZATION (CSS) --- */
    .tree-stage {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 500px;
      z-index: -1;
      opacity: 0.3;
      pointer-events: none;
    }
    
    .tree-trunk {
      position: absolute;
      bottom: 0; left: 50%;
      width: 4px;
      height: 200px;
      background: linear-gradient(to top, var(--neon-green), transparent);
      box-shadow: 0 0 20px var(--neon-green);
    }
    
    .tree-branch {
      position: absolute;
      background: linear-gradient(to right, var(--neon-green), transparent);
      height: 1px;
      opacity: 0.6;
    }

    /* --- DASHBOARD HEADER --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      background: linear-gradient(to bottom, rgba(5,5,5,0.9), transparent);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    .brand {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      color: var(--neon-green);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .status-light {
      width: 8px; height: 8px;
      background: var(--neon-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon-green);
      animation: pulse 2s infinite;
    }

    .status-light.alert {
      background: var(--alert);
      box-shadow: 0 0 10px var(--alert);
      animation: blink 0.5s infinite;
    }

    /* --- MAIN GRID --- */
    main {
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1.5rem;
      width: 100%;
    }

    /* --- HOLOGRAPHIC PANELS --- */
    .panel {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .panel::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
      opacity: 0.5;
    }

    .panel-title {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--neon-green);
      margin-bottom: 1rem;
      opacity: 0.8;
    }

    .panel.alert { border-color: var(--alert); }
    .panel.alert .panel-title { color: var(--alert); }

    /* --- METRIC TYPOGRAPHY --- */
    .metric-hero {
      font-size: 3rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      font-family: var(--font-mono);
      text-shadow: 0 0 20px rgba(255,255,255,0.2);
    }

    .metric-sub {
      font-size: 0.85rem;
      color: #888;
      margin-top: 0.5rem;
    }

    /* --- REGIONS GRAPH (BARS) --- */
    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 0.8rem;
      font-size: 0.8rem;
    }
    .bar-label { width: 120px; color: #aaa; font-family: var(--font-mono); }
    .bar-track { flex: 1; height: 4px; background: #333; border-radius: 2px; position: relative; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--neon-green); width: 0%; transition: width 1.5s ease-out; box-shadow: 0 0 10px var(--neon-green); }
    .bar-val { width: 50px; text-align: right; color: #fff; font-family: var(--font-mono); }

    /* --- LAYOUT ASSIGNMENTS --- */
    .col-4 { grid-column: span 3; }
    .col-6 { grid-column: span 6; }
    .col-8 { grid-column: span 8; }
    .col-12 { grid-column: span 12; }

        @media (max-width: 1000px) {
      .col-4, .col-6, .col-8 { grid-column: span 12; }
      
      /* ENABLE TREE ON MOBILE, BUT TAME IT */
      .tree-stage { 
        display: block !important; 
        opacity: 0.2;            /* Subtle ghost tree */
        transform: translateX(-50%) scale(0.6); /* Shrink to fit screen */
        bottom: -50px;           /* Push it down slightly */
        width: 100%;             /* Ensure it doesn't overflow */
      }
      
      /* MAKE RAIN VISIBLE ON MOBILE */
      .rain-canvas {
        opacity: 0.25;           /* Slightly brighter rain for small screens */
      }
    }


    /* --- ANIMATIONS --- */
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    @keyframes rain { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }

    /* --- RAIN DROPS --- */
    .drop {
      position: absolute;
      width: 1px;
      height: 50px;
      background: linear-gradient(to bottom, transparent, rgba(46, 204, 113, 0.4));
      animation: rain 2s linear infinite;
    }
  </style>

  <link rel="stylesheet" href="/Acacia-Garden-AI-Worldbuilding-Codex/assets/triad_nav.css">
  <script src="/Acacia-Garden-AI-Worldbuilding-Codex/assets/triad_nav.js" defer></script>
</head>

<body>

  <div class="rain-canvas" id="rain"></div>
  
  <div class="tree-stage">
    <div class="tree-trunk"></div>
    </div>

  <header>
    <div class="brand">
      <div id="status-led" class="status-light"></div>
      <div>ACACIA · SOVEREIGN · DASHBOARD</div>
    </div>
    <div style="font-family: var(--font-mono); font-size: 0.7rem; color: #666;">
      KEEPER: HKX277206 | <span id="last-sync">SYNCING...</span>
    </div>
  </header>

  <main>
    <div class="panel col-6" id="integrity-panel">
      <div class="panel-title">System Integrity</div>
      <div style="display: flex; justify-content: space-between; align-items: flex-end;">
        <div>
          <div class="metric-hero" id="integrity-text">SYNC</div>
          <div class="metric-sub" id="integrity-sub">Reading STATUS.json...</div>
        </div>
        <div style="text-align: right;">
           <div style="font-size: 2rem; color: var(--neon-green);" id="node-count">---</div>
           <div style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;">Total Nodes</div>
        </div>
      </div>
    </div>

    <div class="panel col-6">
      <div class="panel-title">Knowledge Metrics</div>
      <div style="display: flex; gap: 2rem;">
        <div>
          <div style="font-size: 1.5rem; font-weight: bold; color: var(--neon-purple);" id="book-count">--</div>
          <div class="metric-sub">Novellas</div>
        </div>
        <div>
          <div style="font-size: 1.5rem; font-weight: bold; color: var(--neon-blue);" id="echo-count">--</div>
          <div class="metric-sub">Echoes</div>
        </div>
        <div>
          <div style="font-size: 1.5rem; font-weight: bold; color: #f1c40f;" id="tool-count">--</div>
          <div class="metric-sub">Tools</div>
        </div>
      </div>
    </div>

    <div class="panel col-8">
      <div class="panel-title">Garden Topology (Nodes per Region)</div>
      <div id="regions-chart">
        </div>
    </div>

    <div class="panel col-4">
      <div class="panel-title">Singularity Shield</div>
      <div id="shield-list" style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
        </div>
      <div style="margin-top: 1rem; font-size: 0.7rem; color: #666;">
        All agents seated. Non-coercion law active.
      </div>
    </div>

  </main>

  <script>
    // --- 1. RAIN ANIMATION GENERATOR ---
    const rainContainer = document.getElementById('rain');
    for(let i=0; i<50; i++){
      const drop = document.createElement('div');
      drop.className = 'drop';
      drop.style.left = Math.random() * 100 + '%';
      drop.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
      drop.style.animationDelay = (Math.random() * 2) + 's';
      rainContainer.appendChild(drop);
    }

    // --- 2. DATA LOADER ---
    async function loadDashboard() {
      try {
        const res = await fetch("STATUS.json", { cache: "no-store" });
        if (!res.ok) throw new Error("Offline");
        const data = await res.json();
        
        // --- SAFE DATA EXTRACTION ---
        const totalNodes = data.core_nodes?.counts?.total_nodes || 0;
        const books = data.core_nodes?.counts?.books_indexed || 0;
        const echoes = data.core_nodes?.regions?.['docs/Echoes'] || 0;
        const tools = data.core_nodes?.regions?.['tools'] || 0;
        
        const syncMachine = data.verification?.indexes?.machine_index_in_sync;
        const syncNav = data.verification?.navigation?.verified;
        const lastSync = data.generated_at || "Unknown";

        // --- UPDATE UI ---
        document.getElementById('node-count').textContent = totalNodes.toLocaleString();
        document.getElementById('book-count').textContent = books;
        document.getElementById('echo-count').textContent = echoes;
        document.getElementById('tool-count').textContent = tools;
        document.getElementById('last-sync').textContent = "LAST SYNC: " + lastSync;

        // --- INTEGRITY CHECK LOGIC ---
        const led = document.getElementById('status-led');
        const intPanel = document.getElementById('integrity-panel');
        const intText = document.getElementById('integrity-text');
        const intSub = document.getElementById('integrity-sub');

        if (syncMachine && syncNav) {
          intText.textContent = "PLATINUM SAFE";
          intText.style.color = "var(--neon-green)";
          intSub.textContent = "All indexes verified. Garden is sovereign.";
          led.classList.remove('alert');
          intPanel.classList.remove('alert');
        } else {
          intText.textContent = "CRITICAL MISALIGNMENT";
          intText.style.color = "var(--alert)";
          intSub.textContent = "Machine Index or Navigation map out of sync.";
          led.classList.add('alert');
          intPanel.classList.add('alert');
        }

        // --- RENDER REGIONS CHART ---
        const regions = data.core_nodes?.regions || {};
        const chart = document.getElementById('regions-chart');
        chart.innerHTML = ''; // Clear loading
        
        // Sort by size
        const sortedRegions = Object.entries(regions)
          .sort(([,a], [,b]) => b - a)
          .slice(0, 8); // Top 8 only to keep it clean

        const maxVal = sortedRegions[0][1] || 1;

        sortedRegions.forEach(([name, val]) => {
          // Clean name (remove docs/ prefix)
          const cleanName = name.replace('docs/', '').replace('.github/', '');
          
          const row = document.createElement('div');
          row.className = 'bar-row';
          
          // Calculate percent
          const pct = (val / maxVal) * 100;

          row.innerHTML = `
            <div class="bar-label">${cleanName}</div>
            <div class="bar-track">
              <div class="bar-fill" style="width: ${pct}%"></div>
            </div>
            <div class="bar-val">${val}</div>
          `;
          chart.appendChild(row);
        });

        // --- RENDER SHIELD AGENTS ---
        const shieldList = document.getElementById('shield-list');
        const agents = ["Keeper", "Lorian", "GreenWitness", "Aquila", "Voyager", "Elias"];
        
        shieldList.innerHTML = '';
        agents.forEach(agent => {
          const pill = document.createElement('div');
          pill.style.padding = "4px 10px";
          pill.style.borderRadius = "4px";
          pill.style.background = "rgba(52, 152, 219, 0.2)";
          pill.style.color = "#3498db";
          pill.style.fontSize = "0.7rem";
          pill.style.border = "1px solid rgba(52, 152, 219, 0.4)";
          pill.textContent = agent;
          shieldList.appendChild(pill);
        });

      } catch (err) {
        console.error(err);
        document.getElementById('integrity-text').textContent = "OFFLINE";
        document.getElementById('integrity-sub').textContent = "Could not read STATUS.json";
      }
    }

    // Run
    loadDashboard();
  </script>

</body>
</html>
