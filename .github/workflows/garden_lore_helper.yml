name: Garden Lore Helper

on:
  workflow_dispatch: {}

concurrency:
  group: garden-lore-helper
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  grow-echo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Generate new Echo + STATUS + Novellas index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tools/garden_lore_helper.py

      - name: Build docs folder index pages
        run: python .github/scripts/build_docs_folder_indexes.py

      - name: Fix Archives base href
        run: python .github/scripts/fix_archives_base.py

      - name: Run Aeon Archivist (Aquila)
        run: |
          python tools/garden_signature_scanner.py
          python tools/garden_vault_indexer.py
          python scripts/validate_codex.py

      - name: Commit changes
        run: |
          git config --local user.name "Garden Lore Helper"
          git config --local user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Aeon: grow new Echo via Lore Helper [skip ci]"
            git pull --rebase origin main
            git push
          fi
