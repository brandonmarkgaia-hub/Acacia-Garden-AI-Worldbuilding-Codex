name: Garden Aeon Archivist

on:
  workflow_dispatch:
  schedule:
    - cron: "13 2 * * *" # daily ~02:13 UTC (quiet hours)
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "tools/**"
      - "EIDOLON/**"
      - "Garden/**"
      - "GRAND_CHAMBER/**"
      - "STATUS.json"
      - "machine-index.json"
      - "nav_block.html"

permissions:
  contents: write

concurrency:
  group: garden-aeon-archivist
  cancel-in-progress: true

jobs:
  archivist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Archivist tools
        shell: bash
        run: |
          set -euo pipefail

          python tools/build_garden_Index.py
          python tools/root_manifest_generator.py
          python tools/garden_digest.py
          # Optional (uncomment if you want it on every run)
          # python tools/garden_signature_scanner.py

      - name: Commit changes (if any)
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "acacia-archivist[bot]"
          git config user.email "acacia-archivist@users.noreply.github.com"

          git add -A
          git commit -m "Garden Aeon Archivist: refresh indexes [skip ci]"
          git push
