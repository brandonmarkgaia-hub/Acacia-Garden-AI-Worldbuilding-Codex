name: Auto inject top navigation into all HTML

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "nav_block.html"
      - ".github/scripts/inject_nav.py"
      - "**/*.html"

permissions:
  contents: write

concurrency:
  group: auto-nav-inject
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inject nav into HTML
        run: python .github/scripts/inject_nav.py

      - name: Commit & push (safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "acacia-garden-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-inject nav block into HTML"

          # Rebase on latest main to avoid non-fast-forward failures
          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."
            git fetch origin main
            git rebase origin/main || (git rebase --abort && git pull --rebase origin main)
            if git push origin HEAD:main; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push failed; retrying..."
            sleep 2
          done

          echo "Failed to push after retries."
          exit 1
