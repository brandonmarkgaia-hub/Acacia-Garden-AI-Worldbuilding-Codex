name: Auto inject top navigation into all HTML

on:
  workflow_dispatch:
  push:
    paths:
      - "nav_block.html"
      - "**/*.html"
      - ".github/workflows/auto-nav-inject.yml"

permissions:
  contents: write

jobs:
  inject-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject nav_block into HTML pages
        run: |
          python - <<'PY'
          import os, re, sys

          NAV_FILE = "nav_block.html"
          if not os.path.exists(NAV_FILE):
              print("Missing nav_block.html at repo root.")
              sys.exit(1)

          with open(NAV_FILE, "r", encoding="utf-8") as f:
              nav = f.read().strip()

          # Inject right after <body> OR after opening <body ...>
          body_re = re.compile(r"(<body[^>]*>)", re.IGNORECASE)

          # Skip these paths (edit if you want)
          SKIP_DIRS = {".git", ".github", "node_modules"}

          changed = 0
          scanned = 0

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
              for fn in files:
                  if not fn.lower().endswith(".html"):
                      continue

                  path = os.path.join(root, fn)
                  # normalize
                  if path.startswith("./"):
                      path = path[2:]

                  scanned += 1

                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      s = f.read()

                  # if already injected, skip
                  if nav in s:
                      continue

                  m = body_re.search(s)
                  if not m:
                      continue

                  insert_at = m.end()
                  out = s[:insert_at] + "\n" + nav + "\n" + s[insert_at:]

                  if out != s:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(out)
                      changed += 1

          print(f"Scanned {scanned} HTML files. Updated {changed}.")
          PY

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-inject nav_block into HTML"
          git push
