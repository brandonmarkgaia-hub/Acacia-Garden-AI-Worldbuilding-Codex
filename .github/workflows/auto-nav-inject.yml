name: Auto inject top navigation into all HTML

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "nav_block.html"
      - ".github/scripts/inject_nav.py"
      - "**/*.html"

permissions:
  contents: write

concurrency:
  group: auto-nav-inject
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inject nav into HTML
        run: |
          python .github/scripts/inject_nav.py

      - name: Commit changes (if any)
        run: |
          git config user.name "acacia-garden-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Auto-inject nav block into HTML"
          git push
