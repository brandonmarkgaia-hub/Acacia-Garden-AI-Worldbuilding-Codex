name: Refresh Garden Provenance

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/build_provenance.py"
      - ".github/workflows/provenance_refresh.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: acacia-provenance-refresh
  cancel-in-progress: false

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Preserve historical checksum snapshot
        run: |
          echo "CHECKSUMS.sha256 is historical evidence; no automatic restamping."
          test -s CHECKSUMS.sha256

      - name: Detect generated drift without writing to main
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- GARDEN_VERSION.json
