name: Build ACACIA Mega Monolith

on:
  workflow_dispatch:
    inputs:
      printable_base64:
        description: "Also generate printable .b64.txt (bigger than binary)"
        required: true
        default: "true"
      include_git_bundle:
        description: "Also generate full git history bundle (bigger, but best for full recovery)"
        required: true
        default: "false"
      retention_days:
        description: "Artifact retention days (1-90)"
        required: true
        default: "7"

jobs:
  monolith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zstd xz-utils git-lfs

      - name: Pull LFS (if any)
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local || true
          git lfs pull || true

      - name: Build monolith (tracked files snapshot)
        shell: bash
        run: |
          set -euo pipefail

          OUTDIR="out"
          mkdir -p "$OUTDIR"

          # stable timestamp for deterministic tar metadata
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          BASE="ACACIA_MEGA_MONOLITH_${SHORT_SHA}"

          # Pack everything tracked by git (the whole Garden content)
          git ls-files -z | tar \
            --null --files-from=- \
            --sort=name \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            -cf "${BASE}.tar"

          # Compress hard with both; keep smaller result
          zstd --ultra -22 -T0 -q -o "${BASE}.tar.zst" "${BASE}.tar"
          xz -9e -c "${BASE}.tar" > "${BASE}.tar.xz"
          rm -f "${BASE}.tar"

          SZ_ZST=$(stat -c%s "${BASE}.tar.zst")
          SZ_XZ=$(stat -c%s "${BASE}.tar.xz")

          if [ "$SZ_XZ" -lt "$SZ_ZST" ]; then
            rm -f "${BASE}.tar.zst"
            BEST="${BASE}.tar.xz"
          else
            rm -f "${BASE}.tar.xz"
            BEST="${BASE}.tar.zst"
          fi

          echo "BEST_FILE=$BEST" >> "$GITHUB_ENV"
          sha256sum "$BEST" > "${BEST}.sha256"

          # Recovery notes (so future-you can rebuild the Garden anywhere)
          {
            echo "ACACIA MEGA MONOLITH"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Built (epoch): ${SOURCE_DATE_EPOCH}"
            echo "Best file: ${BEST}"
            echo "SHA256: $(cut -d' ' -f1 "${BEST}.sha256")"
            echo ""
            echo "RESTORE:"
            echo "  If .tar.zst:  zstd -d -c ${BEST} | tar -xvf -"
            echo "  If .tar.xz :  xz -d -c ${BEST} | tar -xvf -"
            echo ""
            echo "VERIFY:"
            echo "  sha256sum -c ${BEST}.sha256"
          } > "${OUTDIR}/RECOVER.txt"

          mv "$BEST" "${BEST}.sha256" "$OUTDIR/"

      - name: Optional printable base64 (single text file)
        if: ${{ github.event.inputs.printable_base64 == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          BEST="${{ env.BEST_FILE }}"
          IN="out/$BEST"
          SUM="out/${BEST}.sha256"
          OUT="out/${BEST}.b64.txt"

          {
            echo "# ACACIA MEGA MONOLITH (printable)"
            echo "# Binary file: $BEST"
            echo "# Binary SHA256: $(cut -d' ' -f1 "$SUM")"
            echo "# NOTE: Base64 is bigger than binary."
            echo "# ----BEGIN BASE64----"
            base64 -w 76 "$IN"
            echo "# ----END BASE64----"
          } > "$OUT"

          sha256sum "$OUT" > "${OUT}.sha256"

      - name: Optional full git history bundle (best for full resurrection)
        if: ${{ github.event.inputs.include_git_bundle == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          B="out/ACACIA_GIT_HISTORY.bundle"
          git bundle create "$B" --all
          zstd --ultra -22 -T0 -q -o "${B}.zst" "$B"
          rm -f "$B"
          sha256sum "${B}.zst" > "${B}.zst.sha256"

      - name: Upload artifact (no double-compression)
        uses: actions/upload-artifact@v4
        with:
          name: acacia-mega-monolith
          path: out/
          compression-level: 0
          retention-days: ${{ github.event.inputs.retention_days }}
