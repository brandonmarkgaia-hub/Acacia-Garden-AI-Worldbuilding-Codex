name: Aeon Heartbeat (Ritual, Read-Only)

on:
  workflow_dispatch:

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

permissions:
  contents: read

concurrency:
  group: aeon-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify Garden (proof stamp only)
        run: |
          python tools/garden_verify.py

      - name: Print Verification Summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(Path("STATUS.json").read_text(encoding="utf-8"))
          v = s.get("verification", {})
          a = v.get("archives", {})
          n = v.get("navigation", {})
          i = v.get("indexes", {})

          print("=== AEON HEARTBEAT (READ-ONLY) ===")
          print("last_verified_utc:", v.get("last_verified_utc"))
          print("")
          print("[Archives]")
          print(" total_html:", a.get("total_html"))
          print(" missing_base_href:", a.get("missing_base_href"))
          print(" verified:", a.get("verified"))
          print("")
          print("[Navigation]")
          print(" total_html_scanned:", n.get("total_html_scanned"))
          print(" missing_map_loader_count:", n.get("missing_map_loader_count"))
          print(" verified:", n.get("verified"))
          if n.get("missing_map_loader_count"):
            for p in n.get("missing_map_loader_paths", [])[:25]:
              print("  -", p)
          print("")
          print("[Indexes]")
          print(" docs_urls_count:", i.get("docs_urls_count"))
          print(" machine_index_present:", i.get("machine_index_present"))
          print(" status_schema_present:", i.get("status_schema_present"))
          print("")
          print("NOTE: This workflow is intentionally non-destructive (no commits/push).")
          PY
