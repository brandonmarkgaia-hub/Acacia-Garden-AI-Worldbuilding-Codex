name: Garden · Novellas human index

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/Novellas/BOOK_*.md"
      - "tools/garden_index.py"

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

permissions:
  contents: read

concurrency:
  group: acacia-main-autocommit
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Generate human Novellas index
        run: python tools/garden_index.py

      - name: Report generated index drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- docs/Novellas/GARDEN_MASTER_INDEX.md
