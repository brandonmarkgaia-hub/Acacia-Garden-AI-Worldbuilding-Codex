name: Garden · Novellas human index

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/Novellas/BOOK_*.md"
      - "tools/garden_index.py"

permissions:
  contents: write

concurrency:
  group: acacia-main-autocommit
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate human Novellas index
        run: python tools/garden_index.py

      - name: Commit human index if changed
        run: |
          set -euo pipefail

          if git diff --quiet -- docs/Novellas/GARDEN_MASTER_INDEX.md; then
            echo "No human-index changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Novellas/GARDEN_MASTER_INDEX.md
          git commit -m "chore: update Novellas human index [autogen]"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push conflicted, retrying ($i)..."
            sleep $((RANDOM % 8 + 2))
          done

          echo "Push failed after retries."
          exit 1
