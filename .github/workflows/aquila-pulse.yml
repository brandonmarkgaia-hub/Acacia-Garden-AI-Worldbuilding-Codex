name: Aquila Pulse

on:
  workflow_dispatch: {}

concurrency:
  group: aquila-pulse
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  aquila_pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Aquila Pulse Engine
        run: |
          node scripts/aquila_pulse.js

      - name: Commit Aquila artifacts & log
        run: |
          if git status --porcelain | grep -q "ENTITIES/\|Garden/Proto/Chambers/CHAMBER_PARADOX_000.md\|Shadow/SHDW_ROOT_001.json"; then
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ENTITIES/ Garden/Proto/Chambers/CHAMBER_PARADOX_000.md Shadow/SHDW_ROOT_001.json
            git commit -m "chore: Aquila pulse update [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No Aquila changes to commit."
          fi
