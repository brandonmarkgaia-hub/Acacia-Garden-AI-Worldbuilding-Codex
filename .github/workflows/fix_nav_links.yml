name: Fix Nav Links (prefix depth)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: garden-writer-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Patch nav prefix in all HTML
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for nav prefix bug..."
          MATCHES=$(grep -RIl --include="*.html" "parts.length - 1" . || true)

          if [ -z "${MATCHES}" ]; then
            echo "No matches found. Nothing to patch."
            exit 0
          fi

          echo "Found matches:"
          echo "${MATCHES}"

          while IFS= read -r f; do
            sed -i 's/parts\.length - 1/parts.length - 2/g' "$f"
          done <<< "${MATCHES}"

          echo "Patch complete. Changed files:"
          git status --porcelain || true

      - name: Commit and push (with rebase + retry)
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "acacia-nav-fix"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "chore(nav): fix relative prefix depth (parts.length - 2)"

          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."
            git fetch origin main
            git rebase origin/main || (git rebase --abort && exit 1)

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected, sleeping then retry..."
            sleep $((i * 3))
          done

          echo "Push failed after retries."
          exit 1
