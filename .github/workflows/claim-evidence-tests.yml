name: Claim Evidence Verification Tests

on:
  pull_request:
    paths:
      - 'research/claim_evidence/**'
      - '.github/workflows/claim-evidence-tests.yml'
  push:
    branches: [main]
    paths:
      - 'research/claim_evidence/**'
      - '.github/workflows/claim-evidence-tests.yml'

permissions:
  contents: read

jobs:
  cev-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate CEV example records
        run: python3 research/claim_evidence/validate.py research/claim_evidence/examples.json
      - name: Run CEV negative controls
        run: python3 -m unittest discover -s research/claim_evidence -p 'test_*.py' -v
