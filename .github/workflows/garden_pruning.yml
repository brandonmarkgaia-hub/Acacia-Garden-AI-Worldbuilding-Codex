name: 000_Garden_Pruning_Inscription
on:
  workflow_dispatch:

jobs:
  prune_garden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Witness Inscription
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Using a direct path to the script to prevent path doubling
        run: python .github/scripts/inscribe_all_issues.py

      - name: Commit to Spine
        run: |
          git config --local user.email "witness@acacia.garden"
          git config --local user.name "The Witness"
          git add docs/
          git commit -m "Inscribed open issues to docs/ under Seal HKX277206" || echo "No changes to commit"
          git push
