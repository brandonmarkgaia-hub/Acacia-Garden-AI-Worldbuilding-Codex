name: 000_Garden_Pruning_Inscription

on:
  workflow_dispatch:

  concurrency:
    group: garden-pruning
      cancel-in-progress: true

      jobs:
        sovereign_move:
            runs-on: ubuntu-latest
                timeout-minutes: 20
                    permissions:
                          contents: write
                                issues: write
                                    steps:
                                          - name: Checkout Code
                                                  uses: actions/checkout@v4
                                                          with:
                                                                    fetch-depth: 0

                                                                          - name: Setup Python
                                                                                  uses: actions/setup-python@v5
                                                                                          with:
                                                                                                    python-version: '3.11'
                                                                                                    
                                                                                                          - name: Install Dependencies
                                                                                                                  run: pip install requests
                                                                                                                  
                                                                                                                        - name: Execute Transition
                                                                                                                                env:
                                                                                                                                          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                                                                                                                                  run: python .github/scripts/sovereign_transition.py
                                                                                                                                                  
                                                                                                                                                        - name: Sync and Commit (with retry)
                                                                                                                                                                shell: bash
                                                                                                                                                                        run: |
                                                                                                                                                                                  set -euo pipefail
                                                                                                                                                                                            git config --local user.email "witness@acacia.garden"
                                                                                                                                                                                                      git config --local user.name "The Witness"
                                                                                                                                                                                                                git add .
                                                                                                                                                                                                                          git diff --cached --quiet && echo "No changes to commit." && exit 0
                                                                                                                                                                                                                                    git commit -m "Inscribed Garden Ledger under Seal HKX277206 [skip ci]"
                                                                                                                                                                                                                                              for i in 1 2 3 4 5; do
                                                                                                                                                                                                                                                          echo "Push attempt $i..."
                                                                                                                                                                                                                                                                      git fetch origin main
                                                                                                                                                                                                                                                                                  git rebase origin/main
                                                                                                                                                                                                                                                                                              if git push origin HEAD:main; then
                                                                                                                                                                                                                                                                                                            echo "Push succeeded."
                                                                                                                                                                                                                                                                                                                          exit 0
                                                                                                                                                                                                                                                                                                                                      fi
                                                                                                                                                                                                                                                                                                                                                  echo "Push rejected, retrying..."
                                                                                                                                                                                                                                                                                                                                                              sleep $((i * 2))
                                                                                                                                                                                                                                                                                                                                                                        done
                                                                                                                                                                                                                                                                                                                                                                                  echo "Push failed after 5 retries."
                                                                                                                                                                                                                                                                                                                                                                                            exit 1
