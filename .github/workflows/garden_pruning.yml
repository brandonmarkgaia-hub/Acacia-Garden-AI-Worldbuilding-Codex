name: 000_Garden_Pruning_Inscription
on:
  workflow_dispatch:

jobs:
  sovereign_move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Transition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/sovereign_transition.py

      - name: Sync and Commit
        run: |
          git config --local user.email "witness@acacia.garden"
          git config --local user.name "The Witness"
          git add .
          git pull --rebase origin main
          git commit -m "Sovereign Ledger Migration under Seal HKX277206" || echo "No changes"
          git push
