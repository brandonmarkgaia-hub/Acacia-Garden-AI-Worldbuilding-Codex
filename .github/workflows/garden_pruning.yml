name: 000_Garden_Pruning_Inscription
on:
  workflow_dispatch:

jobs:
  prune_garden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write # Needed to post comments and close threads
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: 1. Inscribe Issues to Docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/inscribe_all_issues.py

      - name: 2. Update Spine Index (STATUS.json)
        run: python .github/scripts/update_spine_index.py

      - name: 3. Commit New Records
        run: |
          git config --local user.email "witness@acacia.garden"
          git config --local user.name "The Witness"
          git add .
          git commit -m "Inscribed and Indexed Garden Ledger under Seal HKX277206" || echo "No changes"
          git push

      - name: 4. Close Inscribed Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/close_all_issues.py
