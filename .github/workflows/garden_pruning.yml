name: 000_Garden_Pruning_Inscription
on:
  workflow_dispatch:

jobs:
  sovereign_move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Fetch all history to ensure rebase works correctly
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Transition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/sovereign_transition.py

      - name: Sync and Commit
        run: |
          git config --local user.email "witness@acacia.garden"
          git config --local user.name "The Witness"
          
          # 1. Stage the newly inscribed .md files and STATUS.json
          git add .
          
          # 2. Commit them locally so the index is clean
          git commit -m "Inscribed Garden Ledger under Seal HKX277206" || echo "No changes to commit"
          
          # 3. Pull latest automated heartbeats/runs and rebase your lore on top
          git pull --rebase origin main
          
          # 4. Push the combined, sovereign history
          git push origin main
