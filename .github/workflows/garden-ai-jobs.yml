name: Garden AI Jobs

on:
  workflow_call:

permissions:
  contents: write

jobs:
  brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python .github/scripts/garden_brain.py

  evolution:
    needs: brain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: python .github/scripts/garden_evolution.py
