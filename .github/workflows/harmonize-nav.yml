name: Harmonize HTML Nav

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.html'
      - 'scripts/update_nav_all_html.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run nav harmonizer script
        run: |
          python scripts/update_nav_all_html.py

      - name: Commit and push if changes (rebase-safe)
        if: ${{ github.actor != 'github-actions[bot]' }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          echo "Changes detected, committing..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          git commit -m "chore: harmonize HTML nav" || true

          # Heal push races
          git pull --rebase origin main
          git push
