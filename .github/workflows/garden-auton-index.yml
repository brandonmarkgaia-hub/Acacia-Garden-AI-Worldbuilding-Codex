name: Garden Crowned Builder (Deterministic)

on:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "docs/**"
      - "scripts/**"
      - "STATUS.json"
      - "STATUS.schema.json"
      - "machine-index.json"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Garden Codex Maintenance"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: garden-crowned-builder
  cancel-in-progress: false

jobs:
  build-index:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build docs folder index pages
        run: python .github/scripts/build_docs_folder_indexes.py

      - name: Fix Archives base href
        run: python .github/scripts/fix_archives_base.py

      - name: Build docs URLs dump
        run: python .github/scripts/build_docs_url_dump.py

      - name: Generate Chambers and Echoes indexes
        run: node scripts/generate_codex_indices.mjs

      - name: Build Echo machine index
        run: python .github/scripts/build_machine_index.py

      - name: Rebuild current STATUS and Novellas inventory
        run: python tools/garden_state.py

      - name: Commit and push owned artifacts
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "acacia-auton"
          git config user.email "actions@github.com"

          ARTIFACTS=(
            "STATUS.json"
            "docs/Novellas/garden_index.json"
            "machine-index.json"
            "docs/docs_urls.html"
            "docs/docs_urls.json"
            "docs/Chambers/index.html"
            "docs/Vaults/index.html"
            "docs/Echoes/index.html"
            "docs/GardenOS/index.html"
            "docs/Novellas/index.html"
            "docs/Chambers/chambers_index.json"
            "docs/Echoes/echoes_index.json"
          )

          shopt -s nullglob
          ARCHIVES=(docs/Archives/*.html)
          shopt -u nullglob

          mkdir -p /tmp/acacia_artifacts
          for f in "${ARTIFACTS[@]}"; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/acacia_artifacts/$(dirname "$f")"
              cp -f "$f" "/tmp/acacia_artifacts/$f"
            fi
          done
          for f in "${ARCHIVES[@]}"; do
            mkdir -p "/tmp/acacia_artifacts/$(dirname "$f")"
            cp -f "$f" "/tmp/acacia_artifacts/$f"
          done

          for i in 1 2 3 4 5; do
            echo "Publish attempt $i..."
            git fetch origin main
            git reset --hard origin/main
            rsync -a --ignore-times /tmp/acacia_artifacts/ ./

            git add -- "${ARTIFACTS[@]}"
            if [ "${#ARCHIVES[@]}" -gt 0 ]; then
              git add -- "${ARCHIVES[@]}"
            fi

            if git diff --cached --quiet; then
              echo "After reset+restore, nothing to commit."
              exit 0
            fi

            git commit -m "chore: refresh Garden artifacts [auton]" || true
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            sleep $((i * 2))
          done

          echo "Push failed after retries."
          exit 1
