name: Garden Auton Index

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Generate Garden lore + STATUS + Novellas index
        run: python tools/garden_lore_helper.py

      - name: Build docs folder index pages
        run: python .github/scripts/build_docs_folder_indexes.py

      - name: Fix Archives base href
        run: python .github/scripts/fix_archives_base.py

      - name: Commit and push updated artifacts (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "acacia-auton"
          git config user.email "actions@github.com"

          git add \
            STATUS.json \
            docs/Novellas/garden_index.json \
            machine-index.json \
            tools/garden_scan_report.json \
            docs/Chambers/index.html \
            docs/Vaults/index.html \
            docs/Echoes/index.html \
            docs/GardenOS/index.html \
            docs/Archives/*.html || true

          if git diff --cached --quiet; then
            echo "Nothing staged to commit."
            exit 0
          fi

          git commit -m "chore: refresh Garden indexes [auton]" || true

          # Heal push races
          git pull --rebase origin main
          git push
