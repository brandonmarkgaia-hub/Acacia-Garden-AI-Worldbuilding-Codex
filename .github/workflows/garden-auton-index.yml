name: Garden Auton Index (Crowned Builder)

on:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "docs/**"
      - "scripts/**"
      - "STATUS.json"
      - "STATUS.schema.json"
      - "machine-index.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garden-auton-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- Deterministic builders ---
      - name: Refresh STATUS + Novellas index
        run: python tools/garden_lore_helper.py

      - name: Build docs folder index pages
        run: python .github/scripts/build_docs_folder_indexes.py

      - name: Fix Archives base href
        run: python .github/scripts/fix_archives_base.py

      - name: Build docs URLs dump (HTML + JSON)
        run: python .github/scripts/build_docs_url_dump.py

      - name: Generate Codex indices (Chambers + Echoes)
        run: node scripts/generate_codex_indices.mjs

      - name: Build machine index (recursive Echoes)
        run: python .github/scripts/build_machine_index.py

      # --- Proof layer ---
      - name: Verify Garden (write proof metrics into STATUS.json)
        run: python tools/garden_verify.py

      # --- Publish (conflict-immune) ---
      - name: Commit and push updated artifacts (conflict-immune)
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "acacia-auton"
          git config user.email "actions@github.com"

          ARTIFACTS=(
            "STATUS.json"
            "docs/Novellas/garden_index.json"
            "machine-index.json"
            "docs/docs_urls.html"
            "docs/docs_urls.json"

            # Folder index pages we generate
            "docs/Chambers/index.html"
            "docs/Vaults/index.html"
            "docs/Echoes/index.html"
            "docs/GardenOS/index.html"

            # Node-generated indices
            "docs/Chambers/chambers_index.json"
            "docs/Echoes/echoes_index.json"
          )

          shopt -s nullglob
          ARCHIVES=(docs/Archives/*.html)
          shopt -u nullglob

          mkdir -p /tmp/acacia_artifacts

          for f in "${ARTIFACTS[@]}"; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/acacia_artifacts/$(dirname "$f")"
              cp -f "$f" "/tmp/acacia_artifacts/$f"
            fi
          done

          for f in "${ARCHIVES[@]}"; do
            mkdir -p "/tmp/acacia_artifacts/$(dirname "$f")"
            cp -f "$f" "/tmp/acacia_artifacts/$f"
          done

          for i in 1 2 3 4 5; do
            echo "Publish attempt $i..."

            git fetch origin main
            git reset --hard origin/main

            rsync -a --ignore-times /tmp/acacia_artifacts/ ./

            git add -A

            if git diff --cached --quiet; then
              echo "After reset+restore, nothing to commit."
              exit 0
            fi

            git commit -m "chore: refresh Garden artifacts [auton]" || true

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected, sleeping then retry..."
            sleep $((i * 2))
          done

          echo "Push failed after retries."
          exit 1
