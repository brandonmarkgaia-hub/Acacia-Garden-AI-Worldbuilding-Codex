name: Garden Crowned Builder (read-only review)

on:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "docs/**"
      - "scripts/**"
      - "STATUS.json"
      - "STATUS.schema.json"
      - "machine-index.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garden-crowned-builder
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build docs folder index pages
        run: python .github/scripts/build_docs_folder_indexes.py

      - name: Fix Archives base href
        run: python .github/scripts/fix_archives_base.py

      - name: Build docs URLs dump
        run: python .github/scripts/build_docs_url_dump.py

      - name: Generate Chambers and Echoes indexes
        run: node scripts/generate_codex_indices.mjs

      - name: Build Echo machine index
        run: python .github/scripts/build_machine_index.py

      - name: Rebuild current STATUS and Novellas inventory
        run: python tools/garden_state.py

      - name: Save generated changes for review (no push)
        run: |
          git diff --binary > /tmp/garden-generated-changes.patch
          git status --short > /tmp/garden-generated-status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: garden-generated-diff-review
          path: |
            /tmp/garden-generated-changes.patch
            /tmp/garden-generated-status.txt
          retention-days: 30
