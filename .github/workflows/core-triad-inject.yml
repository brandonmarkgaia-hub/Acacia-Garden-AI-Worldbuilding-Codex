name: Core Triad Inject (Non-Destructive) — Manual + Conflict-Immune

on:
  workflow_dispatch:

permissions:
  contents: write

# Prevent two injects colliding with each other
concurrency:
  group: core-triad-inject
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run non-destructive injector
        shell: bash
        run: |
          set -euo pipefail

          echo "== Preflight: ensure script exists =="
          if [ ! -f "tools/core_triad_injector.py" ]; then
            echo "ERROR: tools/core_triad_injector.py not found."
            exit 1
          fi

          echo "== Ensure output dirs exist =="
          mkdir -p STATE
          mkdir -p ACACIA_LOGS

          echo "== Run injector =="
          python tools/core_triad_injector.py

      - name: Guardrail — fail if canon files changed
        shell: bash
        run: |
          set -euo pipefail

          # Canon files must NEVER be modified by this injector
          CANON_FILES=(
            "STATUS.json"
            "status.json"
            "aeon_heartbeat.json"
            "Aeon_heartbeat.json"
            "machine-index.json"
            "machine_index.json"
            "garden_scan_report.json"
            "Garden_scan_report.json"
            "docs/docs_urls.html"
            "docs/docs_urls.json"
          )

          echo "== Checking for forbidden modifications to canon files =="
          for f in "${CANON_FILES[@]}"; do
            if git diff --name-only | grep -qx "$f"; then
              echo "ERROR: Injector modified canonical file: $f"
              echo "This workflow is NON-DESTRUCTIVE and will now fail."
              echo ""
              echo "Diff summary:"
              git --no-pager diff -- "$f" || true
              exit 1
            fi
          done

          echo "OK: No canonical files changed."

      - name: Commit injected outputs (STATE + logs) if changed — conflict-immune
        shell: bash
        run: |
          set -euo pipefail

          # Stage only safe outputs
          git add -A STATE/ ACACIA_LOGS/ || true

          if git diff --cached --quiet; then
            echo "Nothing staged (no STATE/ or ACACIA_LOGS/ changes)."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Snapshot staged files so we can rebase/reset safely
          mkdir -p /tmp/core_triad_out
          git diff --name-only --cached > /tmp/core_triad_files.txt

          while IFS= read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/core_triad_out/$(dirname "$f")"
              cp -f "$f" "/tmp/core_triad_out/$f"
            fi
          done < /tmp/core_triad_files.txt

          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."

            git fetch origin main
            git reset --hard origin/main

            # Restore snapshot outputs
            rsync -a /tmp/core_triad_out/ ./

            # Re-stage safe outputs only
            git add -A STATE/ ACACIA_LOGS/ || true

            if git diff --cached --quiet; then
              echo "After reset+restore, nothing to commit."
              exit 0
            fi

            git commit -m "core-triad: non-destructive injection (STATE/)" || true

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected, sleeping then retry..."
            sleep $((i * 2))
          done

          echo "Push failed after retries."
          exit 1
