name: Diamond checksum provenance (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/diamond_checksum_provenance.py'
      - '.github/workflows/diamond-checksum-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Record exact SHA-256 and last modifying commit for ten paths
        run: python tools/diamond_checksum_provenance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diamond-checksum-provenance
          path: /tmp/diamond-checksum-provenance.json
          retention-days: 30
