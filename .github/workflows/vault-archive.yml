name: Vault Archive

on:
  push:
    tags:
      - "v*"

concurrency:
  group: acacia-main-autocommit
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Archive
        run: |
          mkdir -p vault
          zip -r "vault/codex_${GITHUB_REF_NAME}.zip" .

      - name: Commit Archive
        run: |
          git config user.name "Vault"
          git config user.email "vault@acaciacodex.bot"
          git add vault/
          git commit -m "Vault archive for ${GITHUB_REF_NAME}" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push conflicted, retrying ($i)..."
            sleep $((RANDOM % 8 + 2))
          done
