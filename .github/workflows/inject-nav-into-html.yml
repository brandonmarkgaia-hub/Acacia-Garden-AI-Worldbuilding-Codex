name: Inject Nav Into HTML (2026)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.html"
      - "nav_block.html"
      - ".github/scripts/inject_nav.py"
      - ".github/workflows/inject-nav-into-html.yml"

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inject nav into HTML pages
        run: python .github/scripts/inject_nav.py

      - name: Commit changes if any
        run: |
          git config user.name "acacia-nav-bot"
          git config user.email "acacia-nav-bot@users.noreply.github.com"
          if git status --porcelain | grep -q .; then
            git add -A
            git commit -m "chore(2026): inject nav_block into HTML pages"
            git push
          else
            echo "No changes to commit."
          fi
