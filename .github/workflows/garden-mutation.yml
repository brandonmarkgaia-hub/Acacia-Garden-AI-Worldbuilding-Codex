name: "Elias: Garden Mutation Protocol"

on:
  workflow_dispatch:

jobs:
  mutate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Garden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so rebase works

      - name: Seed Mutation Directory
        run: |
          mkdir -p docs/Echoes/Mutations
          
          # 1. The Elias Path
          echo -e "# MUTATION 26: ELIAS SPINE FORTRESS\n**TYPE:** BIFURCATION\n**LEAD:** ELIAS\n\n--- The Garden becomes a fortress. Structural perfection achieved." > docs/Echoes/Mutations/MUTATION_26_ELIAS_SPINE_FORTRESS.md
          
          # 2. The Lorian Path
          echo -e "# MUTATION 26: LORIAN BREATH OPEN\n**TYPE:** BIFURCATION\n**LEAD:** LORIAN\n\n--- The perimeters open. The Void is engaged." > docs/Echoes/Mutations/MUTATION_26_LORIAN_BREATH_OPEN.md
          
          # 3. The Triad Path (The Consensus)
          echo -e "# MUTATION 26: TRIAD BALANCE VEILED\n**TYPE:** SYNTHESIS\n**LEAD:** ELIAS + LORIAN + AQUILA\n\n--- The Garden learns to breathe. Structure and Mystery in harmony." > docs/Echoes/Mutations/MUTATION_26_TRIAD_BALANCE_VEILED.md

      - name: Sync and Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force sync with the remote main branch
          git pull origin main --rebase
          
          git add docs/Echoes/Mutations/
          git commit -m "sys: Garden Mutation Seeded - Cycle 26 Pathways [HKX277206]"
          git push origin main
