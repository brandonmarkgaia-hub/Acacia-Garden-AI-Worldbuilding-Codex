name: Garden Archivist

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: acacia-main-autocommit
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Garden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Scan for Significant Change
        run: |
          echo "Scanning for memory thresholds..."

          # If there's no previous commit (or history is shallow), skip safely.
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "Previous commit found. Computing changed files..."
            git diff --name-only HEAD~1 HEAD | sed '/^$/d' > changed_files.txt
          else
            echo "No previous commit found. Skipping diff safely."
            : > changed_files.txt
          fi

          echo "Changed files:"
          cat changed_files.txt || true

      - name: Promote to Canon if Threshold Met
        run: |
          COUNT=$(grep -cve '^\s*$' changed_files.txt || true)
          echo "Change count: $COUNT"

          if [ "$COUNT" -ge 5 ]; then
            echo "Threshold crossed — promoting snapshot"
            DATE=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
            mkdir -p ARCHIVE/SNAPSHOTS
            git archive --format=zip HEAD -o "ARCHIVE/SNAPSHOTS/GARDEN_STATE_$DATE.zip"
          else
            echo "No promotion required"
          fi

      - name: Commit Archive if Created
        run: |
          git config user.name "Garden Archivist"
          git config user.email "actions@github.com"

          git add ARCHIVE || true
          if git diff --cached --quiet; then
            echo "No archive commit."
          else
            git commit -m "📜 Archivist: Snapshot promoted"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push conflicted, retrying ($i)..."
              sleep $((RANDOM % 8 + 2))
            done
          fi
