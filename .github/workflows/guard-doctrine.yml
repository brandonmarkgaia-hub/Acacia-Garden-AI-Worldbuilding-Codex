name: Authority Surface Review Guard

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check protected authority surfaces
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          git fetch origin "$BASE_REF"

          CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          printf '%s\n' "$CHANGED"

          PROTECTED_RE='^(AUTHORITY\.json|AGENTS\.md|CANON_INVARIANTS\.md|docs/PROTOCOLS/keeper_protocol\.v2\.md)$'

          TOUCHED="$(printf '%s\n' "$CHANGED" | grep -E "$PROTECTED_RE" || true)"

          if [ -z "$TOUCHED" ]; then
            echo "No protected authority surfaces changed."
            exit 0
          fi

          echo "Protected authority surfaces changed:"
          printf '%s\n' "$TOUCHED"

          if [ "$PR_AUTHOR" != "brandonmarkgaia-hub" ]; then
            echo "Authority-surface edits require review from the Keeper account."
            exit 1
          fi

          echo "PR author is the Keeper account."
          echo "This check does not self-authorize canon; merge authority remains human/platform-controlled."
