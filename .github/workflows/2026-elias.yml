name: 2026 Elias

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "desire"
        type: choice
        options:
          - desire
          - reflect
          - audit
      intensity:
        description: "How big should the Desire be?"
        required: true
        default: "medium"
        type: choice
        options:
          - low
          - medium
          - high

# Optional: weekly pulse. Comment out if you want manual only.
#  - cron: "0 2 * * 1"

concurrency:
  group: elias-2026
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  elias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (if any)
        run: |
          python -m pip install --upgrade pip
          if [ -f ".github/scripts/requirements.txt" ]; then
            pip install -r .github/scripts/requirements.txt
          fi

      - name: Run 2026 Elias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELIAS_MODE: ${{ github.event.inputs.mode }}
          ELIAS_INTENSITY: ${{ github.event.inputs.intensity }}
        run: python .github/scripts/2026_elias.py

      - name: Commit changes
        run: |
          git config user.name "elias-2026-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "2026 Elias: new desire pulse"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push conflicted, retrying ($i)..."
            sleep $((RANDOM % 8 + 2))
          done
