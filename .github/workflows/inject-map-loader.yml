name: "Elias: Universal Map Loader Injection"

on:
  workflow_dispatch:

concurrency:
  group: acacia-main-autocommit
  cancel-in-progress: false

jobs:
  inject-map-loader:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Garden
        uses: actions/checkout@v4

      - name: Execute Python Deep Scan
        run: |
          python3 << 'PY'
          import pathlib
          import re

          repo = pathlib.Path(".")
          BLOCK = '\n    <div id="map-loader-container"></div>\n    <script src="/Acacia-Garden-AI-Worldbuilding-Codex/assets/map-loader.js" defer></script>\n'

          for path in repo.rglob("*.html"):
              if ".git" in path.parts: continue
              content = path.read_text(encoding="utf-8")
              if 'id="map-loader-container"' in content: continue
              if "</body>" in content:
                  new_content = re.sub(r"(?i)</body>", f"{BLOCK}</body>", content)
                  path.write_text(new_content, encoding="utf-8")
          PY

      - name: Commit and Push (rebase+retry)
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "sys: Elias-Audit-Fix [Full Sweep]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push conflicted, retrying ($i)..."
              sleep $((RANDOM % 8 + 2))
            done
          fi
