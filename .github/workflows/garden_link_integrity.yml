name: 003_Garden_Link_Integrity
on:
  workflow_dispatch:

jobs:
  sync_links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 1. Run Case-Sync
        run: python .github/scripts/case_sync_links.py

      - name: 2. Rebuild Authoritative Indexes
        run: python tools/garden_lore_helper.py --sync-all

      - name: 3. Sovereign Sync
        run: |
          git config --local user.email "witness@acacia.garden"
          git config --local user.name "The Witness"
          git add .
          git commit -m "Synchronized Link Integrity and Casing under Seal HKX277206" || echo "No changes"
          git pull --rebase origin main
          git push origin main
