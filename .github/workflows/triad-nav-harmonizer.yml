name: Triad Nav Harmonizer (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inject triad nav tags across all HTML
        run: |
          python tools/inject_triad_nav_all_html.py

      - name: Commit & push if changed
        run: |
          git config user.name "Garden-Tool-Runner"
          git config user.email "actions@users.noreply.github.com"
          if git status --porcelain | grep .; then
            git add -A
            git commit -m "Inject Triad Nav (JS+CSS) across all HTML"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No changes to commit."
          fi
