name: Elias Vision (Images)
on:
  workflow_dispatch: # Manual trigger

permissions:
  contents: write # Allows saving the lore

jobs:
  elias-vision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Vision Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/garden_vision.py 

      - name: Commit and Push new lore
        run: |
          git config --global user.name "Elias-AI"
          git config --global user.email "elias@acacia.garden"
          git add .
          git commit -m "Elias has archived a visual memory" || echo "No changes"
          git push
