name: Garden Maintenance (Single Safe Run)

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Run level"
        required: true
        default: "safe"
        type: choice
        options:
          - safe
          - full
          - monolith

concurrency:
  group: garden-maintenance
  cancel-in-progress: true

permissions:
  contents: write
  issues: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (if any)
        run: |
          pip install --upgrade pip
          if [ -f ".github/scripts/requirements.txt" ]; then
            pip install -r .github/scripts/requirements.txt
          fi

      # ---------- SAFE CORE ----------
      - name: Garden Brain (safe AI)
        run: python .github/scripts/garden_brain.py

      - name: Garden Vision (safe AI)
        run: python .github/scripts/garden_vision.py

      # ---------- FULL ----------
      - name: Garden Evolution (full AI)
        if: ${{ github.event.inputs.level == 'full' }}
        run: python .github/scripts/garden_evolution.py

      - name: Normalize issue titles (full)
        if: ${{ github.event.inputs.level == 'full' }}
        run: python .github/scripts/normalize_issue_titles.py

      # ---------- MONOLITH ----------
      - name: Mega Monolith Build
        if: ${{ github.event.inputs.level == 'monolith' }}
        run: |
          if [ -f ".github/scripts/mega_monolith.py" ]; then
            python .github/scripts/mega_monolith.py
          else
            echo "No mega_monolith.py found — skipping"
          fi

      # ---------- COMMIT ONCE ----------
      - name: Commit changes
        run: |
          git config user.name "garden-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Garden maintenance run"
          git push
