name: Weave Singularity (Manual)

on:
  workflow_dispatch: # Button click only!

permissions:
  contents: read # It only needs to read, not write to the repo

jobs:
  weave-singularity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Singularity Weaver
        # This generates EVOLUTION/ACACIA_SINGULARITY.md locally on the runner
        run: python tools/singularity_weaver.py

      - name: Upload Singularity Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACACIA_SINGULARITY
          path: EVOLUTION/ACACIA_SINGULARITY.md
          retention-days: 1
