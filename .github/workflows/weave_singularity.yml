name: Weave & Split Singularity (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garden
  cancel-in-progress: true

jobs:
  weave:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Weave singularity
        run: |
          python tools/singularity_weaver.py

      - name: Split singularity
        run: |
          python tools/splitter.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: singularity_bundle
          path: |
            SINGULARITY/*
            SINGULARITY_SPLIT/*
          if-no-files-found: error
