name: Weave & Split Singularity (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weave-and-split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 1: Create the Monster File
      - name: Run Singularity Weaver
        run: python tools/singularity_weaver.py

      # Step 2: Chop it up (Make sure tools/splitter.py is in your repo!)
      - name: Run Splitter
        run: python tools/splitter.py

      # Step 3: Upload the Parts (Not the big file)
      - name: Upload Singularity Parts
        uses: actions/upload-artifact@v4
        with:
          name: ACACIA_PARTS
          path: ACACIA_PART_*.txt
          retention-days: 1
