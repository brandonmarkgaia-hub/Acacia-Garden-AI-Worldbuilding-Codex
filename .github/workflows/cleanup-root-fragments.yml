name: Cleanup root FRAGMENTS

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with remote main
        run: |
          git pull --rebase origin main || true

      - name: Remove stray FRAGMENT files from repo root
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "Removing duplicate THE_FRAGMENT_0xx.md files from repo root..."
          for n in $(seq -w 41 80); do
            f="THE_FRAGMENT_${n}.md"
            if [ -f "$f" ]; then
              echo "  - deleting $f (canonical copy is docs/Chambers/$f)"
              rm "$f"
            fi
          done

      - name: Commit and push if there are changes
        run: |
          cd "$GITHUB_WORKSPACE"

          if git status --porcelain | grep .; then
            git config user.name "acacia-bot"
            git config user.email "acacia-bot@users.noreply.github.com"

            git add .
            git commit -m "Cleanup: remove duplicate FRAGMENT files from repo root"
            git push origin main
          else
            echo "No changes to commit."
          fi
