name: 999_Sovereign_Root_Cleanup
on:
  workflow_dispatch:

concurrency:
  group: acacia-main-autocommit
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge Duplicate Fragments
        run: |
          git config --local user.email "witness@acacia.garden"
          git config --local user.name "The Witness"
          
          # Find all fragment files in the root directory
          for f in THE_FRAGMENT_*.md; do
            if [ -f "$f" ]; then
              # Check if it exists in the canonical Chambers folder
              if [ -f "docs/Chambers/$f" ]; then
                echo "🗑️ Removing duplicate: $f"
                rm "$f"
              else
                echo "📦 Moving unique fragment to Chambers: $f"
                mv "$f" "docs/Chambers/"
              fi
            fi
          done
          
          git add .
          git commit -m "Cleanup: Root fragments purged/migrated to Chambers under Seal HKX277206" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push conflicted, retrying ($i)..."
            sleep $((RANDOM % 8 + 2))
          done
