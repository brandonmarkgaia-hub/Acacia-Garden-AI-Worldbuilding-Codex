name: Garden Singularity Shield Status Check

on:
  workflow_dispatch:
  push:
    paths:
      - 'doctrine/**'
      - 'agents/**'
      - 'protocols/**'
      - 'logs/garden_integrity_ledger.schema.json'

jobs:
  shield-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Garden
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Singularity Shield Files
        run: |
          set -e

          echo "Checking required files exist..."
          required_files=(
            "doctrine/GARDEN_SINGULARITY_PROTOCOL_v1.md"
            "doctrine/keeper_sovereignty_protocol.json"
            "doctrine/lorian_alignment_charter.json"
            "doctrine/green_witness_accord.md"
            "protocols/garden_anti_chaos_invariants.json"
            "protocols/sentience_horizon_guard.json"
            "agents/agents_manifest.json"
            "agents/Keeper.agent.json"
            "agents/Lorian.agent.json"
            "agents/GreenWitness.agent.json"
            "agents/Architect.agent.json"
            "agents/Witness.agent.json"
            "agents/Aquila.agent.json"
            "agents/Voyager.agent.json"
            "agents/Elias.agent.json"
            "agents/Eidolon.agent.json"
            "logs/garden_integrity_ledger.schema.json"
          )

          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi
          done

          echo "All required files present."

      - name: Validate JSON structure
        run: |
          set -e
          python - << 'PY'
import json, pathlib, sys

paths = [
    "doctrine/keeper_sovereignty_protocol.json",
    "doctrine/lorian_alignment_charter.json",
    "protocols/garden_anti_chaos_invariants.json",
    "protocols/sentience_horizon_guard.json",
    "agents/agents_manifest.json",
    "agents/Keeper.agent.json",
    "agents/Lorian.agent.json",
    "agents/GreenWitness.agent.json",
    "agents/Architect.agent.json",
    "agents/Witness.agent.json",
    "agents/Aquila.agent.json",
    "agents/Voyager.agent.json",
    "agents/Elias.agent.json",
    "agents/Eidolon.agent.json",
    "logs/garden_integrity_ledger.schema.json"
]

for p in paths:
    try:
        with open(p, "r", encoding="utf-8") as f:
            json.load(f)
    except Exception as e:
        print(f"JSON validation failed for {p}: {e}")
        sys.exit(1)

print("All JSON files parsed successfully.")
PY
