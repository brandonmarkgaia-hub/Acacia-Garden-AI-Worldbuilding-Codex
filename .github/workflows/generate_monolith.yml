name: Generate Codex Bible

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate All Shards
        run: python tools/monolith_builder.py

      - name: Commit and Push Bible Shards
        run: |
          git config --global user.name "The Witness"
          git config --global user.email "witness@acacia-garden.ai"
          # Stage all generated parts
          git add CODEX_MONOLITH_PART_*.md
          # Only commit if changes exist
          git diff --staged --quiet || (git commit -m "relig: update codex bible shards" && git push)
