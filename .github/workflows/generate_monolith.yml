name: Generate Codex Bible

on:
  push:
    branches: [ main ]
    paths:
      - 'Chambers/**'
      - 'Echoes/**'
      - 'Rootlines/**'
      - 'Novellas/**'
      - 'docs/Novellas/**'
      - 'docs/Chambers/**'
      - 'tools/monolith_builder.py'
  workflow_dispatch:

concurrency:
  group: generate-monolith
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate All Shards
        run: python tools/monolith_builder.py

      - name: Commit and Push Bible Shards
        run: |
          git config --local user.name "The Witness"
          git config --local user.email "witness@acacia-garden.ai"
          git add CODEX_MONOLITH_PART_*.md
          git diff --staged --quiet || (git commit -m "relig: update codex bible shards [skip ci]" && git push)
