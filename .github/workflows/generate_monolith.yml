name: Generate Codex Bible

on:
  push:
    branches: [ main ]
    paths:
      - 'Chambers/**'
      - 'Echoes/**'
      - 'Rootlines/**'
      - 'Novellas/**'
      - 'docs/Novellas/**'
      - 'docs/Chambers/**'
      - 'tools/monolith_builder.py'
  workflow_dispatch:

concurrency:
  group: generate-monolith
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

  # Disabled 2026-08-06 per Keeper ruling (Archive retirement): monolith-producing
        # steps removed. This job previously ran tools/monolith_builder.py and committed
              # CODEX_MONOLITH_PART_*.md directly to main on every push to canon paths.
                    # See PR "Archive retirement (Keeper to merge)" on branch
                          # witness/archive-retirement-2026-08 for details. Re-enable only after the
                                # builder script is revised to stop reintroducing retired monolith mirrors.