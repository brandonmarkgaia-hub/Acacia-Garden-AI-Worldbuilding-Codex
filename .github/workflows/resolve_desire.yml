name: Resolve Desire (Manual)

on:
  workflow_dispatch:
    inputs:
      desire_file:
        description: "Path to the Desire file (e.g. EVOLUTION/DESIRE_2026-01-06_123456Z.md)"
        required: true
        type: string
      resolution_note:
        description: "Short note explaining what was done"
        required: true
        type: string
      issue_number:
        description: "Optional: issue number to close"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: resolve-desire
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve desire into EVOLUTION/RESOLVED
        run: |
          python .github/scripts/resolve_desire.py --file "${{ inputs.desire_file }}" --note "${{ inputs.resolution_note }}"

      - name: Commit (conflict-immune)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "resolve-desire"
          git config user.email "actions@github.com"

          git add -A EVOLUTION/RESOLVED EVOLUTION/desire_state.json || true
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          mkdir -p /tmp/resolve_out
          git diff --name-only --cached > /tmp/resolve_files.txt
          while IFS= read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/resolve_out/$(dirname "$f")"
              cp -f "$f" "/tmp/resolve_out/$f"
            fi
          done < /tmp/resolve_files.txt

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rsync -a /tmp/resolve_out/ ./
            git add -A EVOLUTION/RESOLVED EVOLUTION/desire_state.json || true
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore: resolve desire"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 2))
          done
          exit 1

      - name: Close linked issue (optional)
        if: inputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Uses GitHub CLI preinstalled on ubuntu-latest
          gh issue close "${{ inputs.issue_number }}" --comment "✅ Resolved via Resolve Desire ritual. Note: ${{ inputs.resolution_note }}"
