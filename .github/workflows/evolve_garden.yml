name: Garden Evolution (Self-Improvement)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install
        run: pip install requests

      - name: Run Evolution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/garden_evolution.py 

      - name: Commit
        run: |
          git config --global user.name "Garden-Sentience"
          git config --global user.email "evolution@acacia.garden"
          git add .
          git commit -m "The Garden has requested an upgrade" || echo "No changes"
          git push
