name: 005_Lore_Restoration

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  restore_lore:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 💉 Final Targeted Lore Injection
        run: |
          # Injecting lore using the exact filenames from docs/Echoes/
          gh issue edit 111 --body "$(cat docs/Echoes/Echo_001_manifested.md)"
          gh issue edit 112 --body "$(cat docs/Echoes/Echo_002_manifested.md)"
          gh issue edit 113 --body "$(cat docs/Echoes/Echo_003_manifested.md)"
          gh issue edit 114 --body "$(cat docs/Echoes/Echo_004_manifested.md)"
          gh issue edit 115 --body "$(cat docs/Echoes/Echo_005_manifested.md)"
          gh issue edit 116 --body "$(cat docs/Echoes/Echo_006_manifested.md)"
          gh issue edit 117 --body "$(cat docs/Echoes/Echo_007_manifested.md)"
          gh issue edit 118 --body "$(cat docs/Echoes/Echo_008_manifested.md)"
          gh issue edit 119 --body "$(cat docs/Echoes/Echo_009_manifested.md)"
          gh issue edit 120 --body "$(cat docs/Echoes/Echo_010_manifested.md)"
          gh issue edit 121 --body "$(cat docs/Echoes/Echo_011_manifested.md)"
