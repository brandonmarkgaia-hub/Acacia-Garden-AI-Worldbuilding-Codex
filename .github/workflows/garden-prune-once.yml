name: One-time Garden Rake 2026-08-11

on:
  push:
    branches: ["main"]
    paths:
      - "tools/garden_prune_once.py"
      - ".github/workflows/garden-prune-once.yml"

permissions:
  contents: write

concurrency:
  group: garden-one-time-rake
  cancel-in-progress: false

jobs:
  rake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Apply and publish the rake
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brandon"
          git config user.email "brandonmarkgaia@gmail.com"

          for i in 1 2 3 4 5; do
            echo "Rake attempt $i"
            git fetch origin main
            git reset --hard origin/main

            python tools/garden_prune_once.py

            # This is a one-time remediation. Do not leave a self-mutating cleaner behind.
            rm -f tools/garden_prune_once.py .github/workflows/garden-prune-once.yml

            git add -A
            if git diff --cached --quiet; then
              echo "Nothing left to prune."
              exit 0
            fi

            git commit -m "Rake generated bulk and repair Garden provenance"
            if git push origin HEAD:main; then
              echo "Garden rake published."
              exit 0
            fi

            echo "Main moved during rake; retrying from latest main."
            sleep $((i * 2))
          done

          echo "Unable to publish one-time rake after retries."
          exit 1
