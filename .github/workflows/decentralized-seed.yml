name: Decentralized Seed (IPFS + IPNS)

on:
  workflow_dispatch:

concurrency:
  group: decentralized-seed
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codex
        uses: actions/checkout@v4

      - name: Bundle the Garden
        run: |
          # Bundles the project into a single seed while excluding git history
          zip -r acacia-garden-seed.zip . -x "*.git*"

      - name: Upload to IPFS (via Pinata)
        id: upload
        uses: aquiladev/ipfs-action@v0.3.1
        with:
          path: ./acacia-garden-seed.zip
          service: pinata
          pinataKey: ${{ secrets.PINATA_API_KEY }}
          pinataSecret: ${{ secrets.PINATA_API_SECRET }}
          pinName: "Acacia-Garden-HKX277206"

      - name: Update IPNS Pointer
        # Only try to update IPNS if upload succeeded
        if: ${{ success() && steps.upload.outputs.hash != '' }}
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          IPFS_CID: ${{ steps.upload.outputs.hash }}
        run: |
          # Use jq to safely construct JSON payload — prevents injection if CID contains special chars
          PAYLOAD=$(jq -n \
            --arg cid "$IPFS_CID" \
            --arg key_name "Acacia-Garden-Sovereign-Key" \
            '{cid: $cid, key_name: $key_name}')
          curl -X POST https://api.pinata.cloud/v3/ipns/records \
            -H "Authorization: Bearer $PINATA_JWT" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
