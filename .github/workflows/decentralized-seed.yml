name: Decentralized Seed (IPFS + IPNS)

on:
  # Manual trigger only – no automatic runs on push
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codex
        uses: actions/checkout@v4

      - name: Bundle the Garden
        run: |
          # Bundles the project into a single seed while excluding git history
          zip -r acacia-garden-seed.zip . -x "*.git*"

      - name: Upload to IPFS (via Pinata)
        id: upload
        uses: aquiladev/ipfs-action@v0.3.1
        with:
          path: ./acacia-garden-seed.zip
          service: pinata
          pinataKey: ${{ secrets.PINATA_API_KEY }}
          pinataSecret: ${{ secrets.PINATA_API_SECRET }}
          # pinataPinName is deprecated; use pinName instead
          pinName: "Acacia-Garden-HKX277206"

      - name: Update IPNS Pointer
        # Only try to update IPNS if upload succeeded
        if: ${{ success() && steps.upload.outputs.hash != '' }}
        run: |
          # This tells the network to point your permanent 'Sovereign-Key' to the new growth
          curl -X POST https://api.pinata.cloud/v3/ipns/records \
          -H "Authorization: Bearer ${{ secrets.PINATA_JWT }}" \
          -H "Content-Type: application/json" \
          -d '{
            "cid": "${{ steps.upload.outputs.hash }}",
            "key_name": "Acacia-Garden-Sovereign-Key"
          }'
