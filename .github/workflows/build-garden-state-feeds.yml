name: Build Garden STATE Feeds

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "STATUS.json"
      - "status.json"
      - "machine-index.json"
      - "MACHINE-INDEX.json"
      - "machine_index.json"
      - "machine-index-beta.json"
      - "machine/**"
      - "tools/garden_scan_report.json"
      - "garden_scan_report.json"
      - "garden_vault_index.json"
      - "aeon_heartbeat.json"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/build-garden-state-feeds.yml"

permissions:
  contents: write

concurrency:
  group: acacia-main-autocommit
  cancel-in-progress: false

jobs:
  build-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # IMPORTANT: allows git log timestamps for files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build STATE feeds
        run: |
          python tools/garden_feeds_build.py

      # THIS is the missing link: make STATE available to GitHub Pages (docs root)
      - name: Publish STATE feeds into docs/STATE
        run: |
          mkdir -p docs/STATE
          cp -f STATE/*.json docs/STATE/ || true

      - name: Commit STATE feeds
        run: |
          git config user.name "acacia-bot"
          git config user.email "actions@users.noreply.github.com"

          git add STATE/*.json docs/STATE/*.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build STATE feeds (dashboard normalized)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push conflicted, retrying ($i)..."
            sleep $((RANDOM % 8 + 2))
          done
