name: Garden Pipeline (Orchestrated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pipeline mode"
        required: true
        default: "safe"
        type: choice
        options: [safe, ai, full]

concurrency:
  group: garden-ai
  cancel-in-progress: true

permissions:
  contents: write
  issues: read

jobs:
  validate:
    uses: ./.github/workflows/validate-status.yml

  index:
    needs: validate
    uses: ./.github/workflows/garden_Index.yml

  ai:
    if: ${{ github.event.inputs.mode != 'safe' }}
    needs: index
    uses: ./.github/workflows/garden-ai-jobs.yml
