name: Acacia Engine - Canon Validator

on:
  push:
    branches:
      - main
  workflow_dispatch: # This adds the manual "Run" button in your app!

jobs:
  validate-lore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codex
        uses: actions/checkout@v4

      - name: Awaken Acacia Engine (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Witness Protocol Check
        run: |
          echo "Booting Acacia Engine..."
          echo "Keeper Seal: HKX277206 active."
          python .github/scripts/hkx_validator.py
