name: Garden GPT Worker

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: "Path to job JSON relative to repo root"
        required: false
        default: "garden_gpt/jobs/test_language.json"

concurrency:
  group: garden-gpt
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Run Garden GPT Worker
        # Input passed via env var to prevent shell injection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JOB_PATH: ${{ github.event.inputs.job_path }}
        run: |
          python -m garden_gpt.runner "$JOB_PATH"

      - name: Run Memory Worker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python garden_gpt/memory_worker.py

      - name: Shadow / Scribe Handshake
        run: |
          python garden_gpt/shadow_status_handshake.py

      - name: Commit Garden GPT output (safe)
        env:
          JOB_PATH: ${{ github.event.inputs.job_path }}
        run: |
          git config --local user.name "garden-gpt-bot"
          git config --local user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Garden GPT changes to commit."
            exit 0
          fi
          git commit -m "Garden GPT output for $JOB_PATH [skip ci]"
          git pull --rebase origin main
          git push
