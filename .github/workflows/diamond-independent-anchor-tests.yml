name: Diamond independent anchor verifier regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/verify_independent_integrity_anchor.py'
      - 'tools/test_verify_independent_integrity_anchor.py'
      - '.github/workflows/diamond-independent-anchor-tests.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  independent-anchor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'cryptography==44.0.3'
      - run: python -m unittest -v tools/test_verify_independent_integrity_anchor.py
