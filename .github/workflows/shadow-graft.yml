name: "Elias: Shadow Node Grafting"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/shadow-graft.yml"

jobs:
  graft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Shadow Graft
        run: |
          python3 << 'PY'
          import pathlib, re
          src, tgt = pathlib.Path("docs/Echoes"), pathlib.Path("docs/Echoes/Issues")
          tgt.mkdir(parents=True, exist_ok=True)
          for f in src.glob("*.md"):
              m = re.search(r"Issue_(\d+)", f.name)
              if m:
                  num = m.group(1).zfill(3)
                  out = tgt / f"Echo_issue_{num}.md"
                  if not out.exists():
                      out.write_text(f"# SHADOW NODE: {num}\n**SOURCE:** {f.name}\n**KEEPER:** HKX277206\n\n--- Linked.")
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sys: Shadow Graft Triggered"
