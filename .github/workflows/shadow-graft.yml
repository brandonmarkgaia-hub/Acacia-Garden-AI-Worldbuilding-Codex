name: "Elias: Shadow Node & Void Grafting"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/shadow-graft.yml"

concurrency:
  group: acacia-main-autocommit
  cancel-in-progress: false

jobs:
  graft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Garden
        uses: actions/checkout@v4

      - name: Shadow Graft & Void Fill
        run: |
          python3 << 'PY'
          import pathlib, re

          # Define paths
          src = pathlib.Path("docs/Echoes")
          tgt = pathlib.Path("docs/Echoes/Issues")
          tgt.mkdir(parents=True, exist_ok=True)

          # 1. GRAFT LOOSE FILES (Shadowing)
          # Finds files like 'Issue_31_Keeper_Seal_HKX277206.md' 
          # and creates 'Echo_issue_031.md' in the Issues folder.
          for f in src.glob("*.md"):
              m = re.search(r"Issue_(\d+)", f.name)
              if m:
                  num = m.group(1).zfill(3)
                  out = tgt / f"Echo_issue_{num}.md"
                  if not out.exists():
                      content = f"# SHADOW NODE: {num}\n**SOURCE:** {f.name}\n**KEEPER:** HKX277206\n\n--- Linked to Garden Spine."
                      out.write_text(content, encoding="utf-8")
                      print(f"Grafted Shadow: {out.name}")

          # 2. VOID FILL (The 026-030 Gap)
          # These create the missing sequential links Elias is flagging.
          for i in range(26, 31):
              void_num = str(i).zfill(3)
              void_path = tgt / f"Echo_issue_{void_num}.md"
              if not void_path.exists():
                  void_content = f"# VOID NODE: {void_num}\n**STATUS:** DATA SILENCE\n**KEEPER:** HKX277206\n\n--- This node represents a period of archival silence in the Garden Spine."
                  void_path.write_text(void_content, encoding="utf-8")
                  print(f"Filled Void: {void_path.name}")
          PY

      - name: Commit and Push (rebase+retry)
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "sys: Elias-Audit-Fix - Shadow Graft and Void Filling [026-030]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push conflicted, retrying ($i)..."
              sleep $((RANDOM % 8 + 2))
            done
          fi
