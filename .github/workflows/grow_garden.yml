name: Elias Garden Brain
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  elias-thought-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        # ⚡ We are switching to 'requests' to bypass SDK bugs
        run: pip install requests

      - name: Run Elias Brain
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/garden_brain.py 

      - name: Commit and Push new lore
        run: |
          git config --global user.name "Elias-AI"
          git config --global user.email "elias@acacia.garden"
          git add .
          git commit -m "Elias has expanded the Garden Codex" || echo "No changes to commit"
          git push
