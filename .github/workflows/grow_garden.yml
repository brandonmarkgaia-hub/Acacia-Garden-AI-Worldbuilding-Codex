name: Elias Garden Brain
on:
  workflow_dispatch: # Allows you to click "Run" manually

permissions:
  contents: write # ⚡ CRITICAL: Lets Elias write new lore to your repo

jobs:
  elias-thought-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4 # ✅ FIXED: Added 'actions/' prefix
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run Elias Brain
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # ✅ VERIFY: Make sure your file is actually in this folder!
        run: python .github/scripts/garden_brain.py 

      - name: Commit and Push new lore
        run: |
          git config --global user.name "Elias-AI"
          git config --global user.email "elias@acacia.garden"
          git add .
          # The '|| echo' prevents a crash if Elias decides not to write anything
          git commit -m "Elias has expanded the Garden Codex" || echo "No changes to commit"
          git push
