name: Elias Garden Brain
on:
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # ⚡ CRITICAL: Allows Elias to commit new lore files
  pull-requests: write

jobs:
  elias-thought-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4 # ✅ FIXED: Added 'actions/' prefix
        with:
          python-version: '3.10'

      - name: Install dependencies
        # installing the specific library that supports the new client
        run: pip install google-genai 

      - name: Run Elias Brain
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Points to the folder where you MUST move the script
        run: python .github/scripts/garden_brain.py 

      - name: Commit and Push new lore
        run: |
          git config --global user.name "Elias-AI"
          git config --global user.email "elias@acacia.garden"
          git add .
          # The '|| echo' prevents failure if no new file was generated
          git commit -m "Elias has expanded the Garden Codex" || echo "No changes to commit"
          git push
