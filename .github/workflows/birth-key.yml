name: Birth Sovereign IPNS Key

on: workflow_dispatch

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Create IPNS Key
        run: |
          # Corrected V3 endpoint for key generation
          curl -X POST https://api.pinata.cloud/v3/keywave/ipns/keys \
          -H "Authorization: Bearer ${{ secrets.PINATA_JWT }}" \
          -H "Content-Type: application/json" \
          -d '{"name": "Acacia-Garden-Sovereign-Key"}'
