name: Build static library list

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "docs/Library/**"
      - "scripts/build-library.mjs"

permissions:
  contents: write

concurrency:
  group: build-library
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build library index
        run: node scripts/build-library.mjs

      - name: Commit & push (safe)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "acacia-garden-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/library_index.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update library index"

          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."
            git fetch origin main
            git rebase origin/main || (git rebase --abort && git pull --rebase origin main)
            if git push origin HEAD:main; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push failed; retrying..."
            sleep 2
          done

          echo "Failed to push after retries."
          exit 1
