name: Build static library list

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "docs/Library/**"
      - "scripts/build-library.mjs"

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

permissions:
  contents: read

concurrency:
  group: acacia-main-autocommit
  cancel-in-progress: false

jobs:
  build_library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build library index
        run: node scripts/build-library.mjs

      - name: Report generated artifact drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- docs/library_index.json
