name: Build static library list

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "docs/Library/**"
      - "scripts/build-library.mjs"

permissions:
  contents: write

jobs:
  build_library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build library index
        run: node scripts/build-library.mjs

      - name: Commit and push (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git config user.name "garden-library-bot"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "chore(library): rebuild docs/library_index.json"

          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || (git rebase --abort && git pull --rebase origin main)
            if git push origin HEAD:main; then
              echo "Pushed."
              exit 0
            fi
            sleep 2
          done

          echo "Push failed after retries."
          exit 1
