name: Garden Auton Helper

on:
  push:
    paths:
      - "STATUS.json"
      - "docs/Echoes/**"
      - "tools/garden_auton_helper.py"
      - ".github/workflows/garden-auton.yml"
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch: {}

jobs:
  auton:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GARDEN_AUTON_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Run Garden Auton Helper (Loki)
        run: |
          python tools/garden_auton_helper.py all --node "Broken Dew"

      - name: Commit JSON outputs (rebase-safe)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "garden-auton-bot"
          git config user.email "actions@github.com"

          git add logs/auton_latest.json logs/aeon_heartbeat.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update auton + heartbeat logs" || true

          # Heal push races
          git pull --rebase origin main
          git push
