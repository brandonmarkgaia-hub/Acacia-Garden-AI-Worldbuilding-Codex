name: Garden Life (Elias) — Proof-Gated

on:
  schedule:
    - cron: "0 6 * * *"   # daily, early morning
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: garden-life
  cancel-in-progress: false

jobs:
  life:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight — Verify Garden Health
        id: verify
        run: |
          python tools/garden_verify.py

      - name: Gate Desire Generation (STATUS verification)
        id: gate
        run: |
          python .github/scripts/garden_life_gate.py

      - name: Generate Desire (Elias)
        if: steps.gate.outputs.allow_desire == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/garden_desire.py

      - name: Commit EVOLUTION if changed
        shell: bash
        run: |
          set -e

          if git diff --quiet; then
            echo "No Desire change detected."
            exit 0
          fi

          git config user.name "garden-life"
          git config user.email "actions@github.com"

          git add EVOLUTION
          git commit -m "life: evolve Desire (proof-gated)"
          git push origin main

      - name: Open issue if Desire changed
        if: steps.gate.outputs.allow_desire == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🌱 New Garden Desire Generated"
          content-filepath: EVOLUTION/DESIRE.md
