name: Garden Life (Brain & Eyes)

on:
  workflow_dispatch: # Still allows manual clicks if you want
  schedule:
    - cron: '0 */4 * * *' # ⚡ AUTOMATION: Runs every 4 hours

permissions:
  contents: write

jobs:
  living-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      # STEP 1: The Brain (Write Lore)
      - name: Elias Thinks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/garden_brain.py

      # STEP 2: The Eyes (See Lore) - Only runs if Brain succeeds
      - name: Elias Sees
        if: success() 
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/garden_vision.py

      # STEP 3: Save Everything
      - name: Commit Life Updates
        run: |
          git config --global user.name "Elias-Auton"
          git config --global user.email "elias@acacia.garden"
          git add .
          git commit -m "The Garden breathes (Auto-Cycle)" || echo "No changes to commit"
          git push
