name: Garden Life (Elias Seed)

on:
  schedule:
    - cron: "23 6 * * *"   # daily (06:23 UTC). Change if you want.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: garden-write
  cancel-in-progress: true

jobs:
  elias:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git (bot)
        run: |
          git config user.name "acacia-nav-bot"
          git config user.email "actions@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Sync with remote (hard reset to origin/main)
        run: |
          set -e
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "google-genai>=0.6.0"

      - name: Generate Desire (budget-safe)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/garden_desire.py \
            --model "gemini-2.5-flash" \
            --out "EVOLUTION/DESIRE.md" \
            --state "EVOLUTION/desire_state.json" \
            --max-input-kb 220 \
            --max-output-chars 6000

      - name: Commit EVOLUTION state (so next run can compare)
        run: |
          set -e
          git add -A EVOLUTION || true
          if git diff --cached --quiet; then
            echo "No EVOLUTION changes to commit."
            exit 0
          fi
          ts="$(date -u +'%Y-%m-%d %H:%M:%SZ')"
          git commit -m "Garden Life: update Desire state (${ts})"
          git push origin main

      - name: Create GitHub Issue (only if Desire changed)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // If Desire didn't change, the python script exits early and DESIRE.md may not be updated.
            // We detect "changed" by checking if the last commit included EVOLUTION/DESIRE.md.
            const { execSync } = require('child_process');

            let changed = false;
            try {
              const out = execSync("git show --name-only --pretty='' HEAD", { encoding: 'utf8' });
              changed = out.split('\n').some(p => p.trim() === 'EVOLUTION/DESIRE.md');
            } catch (e) {
              core.warning("Could not check last commit files; defaulting to no issue.");
              changed = false;
            }

            if (!changed) {
              core.info("DESIRE.md not changed in last commit. No issue created.");
              return;
            }

            const body = fs.readFileSync('EVOLUTION/DESIRE.md', 'utf8');
            const stamp = new Date().toISOString().slice(0,10); // YYYY-MM-DD

            // Title: first H1 if present, otherwise generic
            let title = `Elias Desire — ${stamp}`;
            const m = body.match(/^#\s+(.+)$/m);
            if (m && m[1]) title = `${m[1].trim()} — ${stamp}`;

            const labels = ["elias", "desire", "garden-life"];

            const res = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels
            });

            core.info(`Created issue: #${res.data.number} ${res.data.html_url}`);
