name: Garden Life (Manual) — Desire + Echo Issue

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: garden-life
  cancel-in-progress: true

jobs:
  life:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Verify Garden (proof into STATUS.json)
        run: |
          python tools/garden_verify.py

      - name: Generate Desire (Elias)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/garden_desire.py

      - name: Stamp Desire into EVOLUTION (timestamped file)
        run: |
          python .github/scripts/stamp_desire_file.py

      - name: Commit EVOLUTION outputs (conflict-immune)
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "garden-life"
          git config user.email "actions@github.com"

          # Stage only EVOLUTION outputs
          git add -A EVOLUTION || true

          if git diff --cached --quiet; then
            echo "No EVOLUTION changes to commit."
            exit 0
          fi

          mkdir -p /tmp/garden_life_out
          git diff --name-only --cached > /tmp/garden_life_files.txt

          while IFS= read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/garden_life_out/$(dirname "$f")"
              cp -f "$f" "/tmp/garden_life_out/$f"
            fi
          done < /tmp/garden_life_files.txt

          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."
            git fetch origin main
            git reset --hard origin/main
            rsync -a /tmp/garden_life_out/ ./
            git add -A EVOLUTION || true

            if git diff --cached --quiet; then
              echo "After reset+restore, nothing to commit."
              exit 0
            fi

            git commit -m "life: stamp desire (manual)"
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected, retrying..."
            sleep $((i * 2))
          done

          echo "Push failed after retries."
          exit 1

      - name: Open Issue (Echo/Seed) from stamped Desire
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🌱 Garden Life — New Desire Seed"
          content-filepath: EVOLUTION/DESIRE_LATEST.md
