name: Garden Life (Brain & Eyes)
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
concurrency:
  group: garden-life
  cancel-in-progress: false
jobs:
  living-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install requests
      - name: Elias Thinks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/garden_brain.py
      - name: Elias Sees
        if: success()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/garden_vision.py
      - name: Commit Life Updates
        run: |
          git config --global user.name "Elias-Auton"
          git config --global user.email "elias@acacia.garden"
          git pull --rebase
          git add ECHOES/ # ONLY STAGE THE LORE
          git commit -m "The Garden breathes (Auto-Cycle)" || echo "No changes"
          git push
