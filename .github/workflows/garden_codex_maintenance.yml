```yaml
name: Garden Codex Maintenance

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: acacia-main-autocommit
  cancel-in-progress: false

jobs:
  codex-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fix Novellas and build Codex indexes, manifest & API
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          ROOT = Path(".").resolve()
          NOVELLAS_DIR = ROOT / "docs" / "Novellas"
          ARCHIVES_DIR = ROOT / "docs" / "Archives"
          API_DIR = ROOT / "docs" / "api"

          ARCHIVES_DIR.mkdir(parents=True, exist_ok=True)
          API_DIR.mkdir(parents=True, exist_ok=True)

          MD_INDEX_MD = ARCHIVES_DIR / "FULL_CODEX_INDEX.md"
          MD_INDEX_JSON = ARCHIVES_DIR / "FULL_CODEX_INDEX.json"
          MANIFEST_JSON = ARCHIVES_DIR / "GARDEN_MANIFEST.json"
          API_INDEX_JSON = API_DIR / "GARDEN_API_INDEX.json"

          # ---------------------------------------------------------
          # 1) FIX NOVELLA HEADINGS
          # ---------------------------------------------------------

          def needs_heading(text: str) -> bool:
              for line in text.splitlines():
                  stripped = line.strip()

                  if not stripped:
                      continue

                  if stripped.startswith("#"):
                      heading = stripped.lstrip("#").strip().lower()
                      return not heading.startswith("book ")

                  return True

              return True


          def make_heading(filename: str) -> str | None:
              if not filename.endswith(".md"):
                  return None

              name = filename[:-3]

              if not name.startswith("The_Garden_"):
                  return None

              rest = name[len("The_Garden_"):]

              if "_Book_" not in rest:
                  return None

              title_part, roman_part = rest.rsplit("_Book_", 1)

              roman = roman_part.upper()
              title_words = title_part.replace("_", " ")
              title = f"The Garden {title_words}"

              return f"# Book {roman} — {title}"


          if NOVELLAS_DIR.is_dir():
              for path in sorted(
                  NOVELLAS_DIR.glob("The_Garden_*_Book_*.md")
              ):
                  text = path.read_text(encoding="utf-8")

                  if not needs_heading(text):
                      print(f"[SKIP] {path}")
                      continue

                  heading = make_heading(path.name)

                  if not heading:
                      print(
                          f"[WARN] Could not derive heading for {path}"
                      )
                      continue

                  new_text = heading + "\n\n" + text

                  path.write_text(
                      new_text,
                      encoding="utf-8",
                  )

                  print(
                      f"[FIXED] Inserted heading in {path}"
                  )
          else:
              print(
                  f"[WARN] Novellas dir not found at {NOVELLAS_DIR}"
              )

          # ---------------------------------------------------------
          # 2) BUILD FULL CODEX INDEX — MARKDOWN SOURCES
          # ---------------------------------------------------------

          EXCLUDE_DIRS = {
              ".git",
              ".github",
              "node_modules",
              "dist",
              "machine",
              "scripts",
              ".well-known",
          }

          EXCLUDE_FILES = {
              "README.md",
              "README_GARDEN.md",
          }


          def is_excluded(path: Path) -> bool:
              rel = path.relative_to(ROOT)
              parts = rel.parts

              if parts and parts[0] in EXCLUDE_DIRS:
                  return True

              if rel.name in EXCLUDE_FILES:
                  return True

              return False


          md_entries = sorted(
              (
                  path.relative_to(ROOT)
                  for path in ROOT.rglob("*.md")
                  if not is_excluded(path)
              ),
              key=str,
          )

          sections: dict[str, list[Path]] = {}

          for rel in md_entries:
              top = rel.parts[0]
              sections.setdefault(top, []).append(rel)

          # Markdown index
          lines = [
              "# 🌳 Full Garden Codex Index",
              "",
              "_Automatically generated by "
              "garden_codex_maintenance.yml_",
              "",
          ]

          for top in sorted(sections):
              lines.append(f"## {top}")
              lines.append("")

              for rel in sorted(
                  sections[top],
                  key=str,
              ):
                  lines.append(f"- `{rel}`")

              lines.append("")

          MD_INDEX_MD.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print(
              f"[INDEX] Wrote full index → {MD_INDEX_MD}"
          )

          # JSON index
          json_entries = []

          for rel in md_entries:
              json_entries.append(
                  {
                      "path": str(rel),
                      "top": rel.parts[0],
                      "name": rel.name,
                  }
              )

          MD_INDEX_JSON.write_text(
              json.dumps(
                  json_entries,
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )

          print(
              f"[INDEX] Wrote JSON index → {MD_INDEX_JSON}"
          )

          # ---------------------------------------------------------
          # 3) BUILD GARDEN MANIFEST — TEXT-LIKE FILES
          # ---------------------------------------------------------
          #
          # The former bulk Monolith generation system was retired
          # on 2026-08-06 by Keeper ruling.
          #
          # This workflow now maintains only source-oriented indexes,
          # the Garden manifest, and the machine-facing API pointer.
          # No Monolith chunks or aggregate Monolith mirrors are
          # generated here.
          # ---------------------------------------------------------

          TEXT_EXTS = {
              ".md",
              ".txt",
              ".json",
              ".yml",
              ".yaml",
              ".js",
              ".ts",
              ".jsx",
              ".tsx",
              ".css",
              ".scss",
              ".html",
              ".htm",
              ".svg",
              ".py",
              ".sh",
              ".ps1",
              ".toml",
              ".ini",
              ".cfg",
              ".xml",
          }

          MANIFEST_EXCLUDE_DIRS = EXCLUDE_DIRS | {
              ".vscode",
              ".idea",
              ".gitmodules",
          }


          def manifest_excluded(path: Path) -> bool:
              rel = path.relative_to(ROOT)
              parts = rel.parts

              if (
                  parts
                  and parts[0]
                  in MANIFEST_EXCLUDE_DIRS
              ):
                  return True

              return False


          text_files = sorted(
              (
                  path
                  for path in ROOT.rglob("*")
                  if path.is_file()
                  and not manifest_excluded(path)
                  and path.suffix.lower() in TEXT_EXTS
              ),
              key=lambda path: str(
                  path.relative_to(ROOT)
              ),
          )

          manifest_entries = []

          for path in text_files:
              rel = path.relative_to(ROOT)
              parts = rel.parts

              top = parts[0] if parts else ""

              category = ""

              if (
                  len(parts) >= 2
                  and parts[0] == "docs"
              ):
                  category = parts[1]

              manifest_entries.append(
                  {
                      "path": str(rel),
                      "top": top,
                      "category": category,
                      "name": rel.name,
                      "ext": path.suffix.lower(),
                      "size_bytes": path.stat().st_size,
                  }
              )

          MANIFEST_JSON.write_text(
              json.dumps(
                  manifest_entries,
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )

          print(
              f"[MANIFEST] Wrote → {MANIFEST_JSON}"
          )
          print(
              f"[MANIFEST] Indexed "
              f"{len(manifest_entries)} text-like files"
          )

          # ---------------------------------------------------------
          # 4) BUILD GARDEN API INDEX
          # ---------------------------------------------------------

          api_index = {
              "manifest":
                  "docs/Archives/GARDEN_MANIFEST.json"
          }

          API_INDEX_JSON.write_text(
              json.dumps(
                  api_index,
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )

          print(
              f"[API] Wrote API index → {API_INDEX_JSON}"
          )

          print(
              "✅ Garden Codex maintenance complete."
          )

          PY

      - name: Commit and push changes
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config --local user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config --local user.name \
            "github-actions[bot]"

          git add \
            docs/Novellas \
            docs/Archives/FULL_CODEX_INDEX.md \
            docs/Archives/FULL_CODEX_INDEX.json \
            docs/Archives/GARDEN_MANIFEST.json \
            docs/api/GARDEN_API_INDEX.json

          if git diff --cached --quiet; then
            echo "No Codex maintenance changes to commit."
            exit 0
          fi

          git commit -m \
            "chore: refresh codex indexes, manifest and API [skip ci]"

          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."

            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"

            if git push origin HEAD:"$TARGET_BRANCH"; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected, retrying..."
            sleep $((i * 2))
          done

          echo "Push failed after 5 retries."
          exit 1
```
