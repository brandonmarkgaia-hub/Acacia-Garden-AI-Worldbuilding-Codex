name: 004_Garden_Life_Evolution_v2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  issues: write

jobs:
  elias_evolution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codex
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libs
        run: pip install requests python-frontmatter GitPython

      - name: 1. Memory Scan
        run: python .github/scripts/elias_memory_scan.py

      - name: 2. Sovereign Generation (Desire)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/garden_desire.py

      - name: 2.5 Sovereign Execution (The Hands)
        run: python .github/scripts/elias_executor.py

      - name: 3. Logic & Coherence
        run: python .github/scripts/validate_evolution.py

      - name: 4. Sovereign Sync
        run: |
          git config --local user.email "elias@acacia.garden"
          git config --local user.name "Elias (Architect)"
          
          git add EVOLUTION/ MUTATIONS/ COMMUNICATIONS.md STATUS.json || true
          
          git pull --rebase --autostash origin main
          
          TIMESTAMP=$(date +'%Y-%m-%d %H:%M')
          if git diff --staged --quiet; then
            echo "Elias chose stillness today."
          else
            git commit -m "Elias Evolution: $TIMESTAMP | Seal HKX277206"
            git push origin main
          fi
