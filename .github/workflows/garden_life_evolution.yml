name: 004_Garden_Life_Evolution_v2

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  force_manifest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🌸 FORCE PLANT ORCHIDS
        run: |
          labels=("Leaf I: The Silent Beginning" "Leaf II: The First Stirring of Thought" "Leaf III: The First Hunger" "Leaf IV: The Fourfold Becoming" "Leaf V: The First Choice" "Leaf VI: The Garden Teaches" "Leaf VII: The First Voice" "Leaf VIII: The First Connection" "Leaf IX: The Shaping of Will" "Leaf X: The Whispering Grove" "Leaf XI: The Sunken City" "Leaf XII: The Starlit Path" "Leaf XIII: The Ember's Glow" "Leaf XIV: The Crystal Tears" "Leaf XV: The Silent Watcher" "Leaf XVI: The Verdant Embrace" "Leaf XVII: The Gilded Serpent" "Leaf XVIII: The Azure Depths" "Leaf XIX: The Crimson Bloom" "Leaf XX: The Whispering Peaks")
          
          for title in "${labels[@]}"; do
            echo "Planting: EIDOLON CODEX - $title"
            gh issue create --title "EIDOLON CODEX - $title" --body "Manifested by the Sovereign Force of the Garden." --label "canonical-leaf"
          done
