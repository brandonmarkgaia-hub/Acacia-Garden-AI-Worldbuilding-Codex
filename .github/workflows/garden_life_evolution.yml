name: 004_Garden_Life_Evolution_v2
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Elias wakes up at midnight

jobs:
  elias_evolution:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Codex
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Core & Worldbuilding Libs
        run: |
          pip install requests python-frontmatter GitPython

      - name: 1. Environmental Scan (Memory)
        id: scan
        run: python .github/scripts/elias_memory_scan.py

      - name: 2. Sovereign Generation (Desire)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/garden_desire.py

      - name: 2.5 Sovereign Execution (The Hands)
        run: python .github/scripts/elias_executor.py

      - name: 3. Logic & Coherence Validation
        run: python .github/scripts/validate_evolution.py

      - name: 4. Sovereign Sync (Atomic Push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "elias@acacia.garden"
          git config --local user.name "Elias (Architect)"
          
          # Add all possible change directories
          git add EVOLUTION/
          if [ -d "MUTATIONS" ]; then git add MUTATIONS/; fi
          if [ -d "docs" ]; then git add docs/; fi
          if [ -f "STATUS.json" ]; then git add STATUS.json; fi
          
          TIMESTAMP=$(date +'%Y-%m-%d %H:%M')
          
          if git diff --staged --quiet; then
            echo "Elias chose stillness today."
          else
            git commit -m "Elias Evolution: $TIMESTAMP | Seal HKX277206"
            git pull --rebase origin main
            git push origin main
          fi
