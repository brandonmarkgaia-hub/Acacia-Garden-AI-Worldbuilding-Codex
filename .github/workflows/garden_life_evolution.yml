name: 004_Garden_Life_Evolution_v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garden-life-evolution
  cancel-in-progress: true

jobs:
  elias_evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Codex
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libs
        run: pip install requests

      - name: 1. Memory Scan
        run: python .github/scripts/elias_memory_scan.py

      - name: 2. Sovereign Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/garden_desire.py

      - name: 2.5 Sovereign Execution
        run: python .github/scripts/elias_executor.py

      - name: 3. Logic & Coherence
        run: python .github/scripts/validate_evolution.py

      - name: 4. Sync (with retry)
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "elias@acacia.garden"
          git config --local user.name "Elias"
          git add .
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Elias Evolution: $(date) | Seal HKX277206 [skip ci]"
          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected, retrying..."
            sleep $((i * 2))
          done
          echo "Push failed after 5 retries."
          exit 1
