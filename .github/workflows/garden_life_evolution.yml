name: 004_Garden_Life_Evolution_v2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  elias_evolution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codex
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libs
        run: pip install requests

      - name: 1. Memory Scan
        run: python .github/scripts/elias_memory_scan.py

      - name: 2. Sovereign Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/garden_desire.py

      - name: 2.5 Sovereign Execution
        run: python .github/scripts/elias_executor.py

      - name: 3. Logic & Coherence
        run: python .github/scripts/validate_evolution.py

      - name: 4. Sync
        run: |
          git config --local user.email "elias@acacia.garden"
          git config --local user.name "Elias"
          git add .
          git commit -m "Elias Evolution: $(date) | Seal HKX277206" || echo "No changes"
          git pull --rebase origin main
          git push origin main
