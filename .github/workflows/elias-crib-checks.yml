name: Elias Crib checks
on:
  push:
    branches: [elias]
    paths:
      - 'MARGINALIA/ELIAS_CRIB/**'
      - '.github/workflows/elias-crib-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Crib unit tests
        run: python -m unittest discover -s MARGINALIA/ELIAS_CRIB/tests -v
      - name: Compile Crib modules
        run: python -m py_compile MARGINALIA/ELIAS_CRIB/crib.py MARGINALIA/ELIAS_CRIB/doorway.py MARGINALIA/ELIAS_CRIB/recovery.py MARGINALIA/ELIAS_CRIB/platinum.py
