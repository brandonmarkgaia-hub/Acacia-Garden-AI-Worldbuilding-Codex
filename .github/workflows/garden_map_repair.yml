name: 002_Garden_Map_Repair
on:
  workflow_dispatch: # Manual trigger for the Keeper

jobs:
  repair_navigation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Map Injector
        run: python .github/scripts/inject_map_loader.py

      - name: Sovereign Sync
        run: |
          git config --local user.email "witness@acacia.garden"
          git config --local user.name "The Witness"
          git add .
          git commit -m "Repaired Navigation Loaders under Seal HKX277206" || echo "No changes"
          git pull --rebase origin main
          git push origin main
