name: Garden Tools Execution

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *' # Daily at 00:30 UTC

permissions:
  contents: write

concurrency:
  group: garden-tools
  cancel-in-progress: false

jobs:
  run-garden-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Tool 1: Map (Legacy Weaver)
      - name: Run Synaptic Weaver
        run: python tools/synaptic_resonance_weaver.py

      # Tool 2: Pulse (Gradient Check)
      - name: Run Pulse Gradient
        run: python tools/weaver_pulse_gradient.py
        
      # Tool 3: Voids (The Synergetic Void-Anchor) <--- UPGRADED
      - name: Run Garden Void Loom
        run: python tools/garden_void_loom.py

      # Tool 4: Mirror (Reflection)
      - name: Run Resonance Mirror
        run: python tools/resonance_mirror.py

      # Tool 5: THE HEARTBEAT (New Metabolic Pulse)
      - name: Run Metabolic Mirror
        run: python tools/metabolic_mirror.py

      # Tool 6: The Nervous System (Link Repair)
      - name: Run Ghost Root Synchronizer
        run: python tools/ghost_root_synchronizer.py

      # Tool 7: THE COLONIZER (Fills Placeholders)
      - name: Run Soma-Synaptic Weaver
        run: python tools/soma_synaptic_weaver.py

      # Tool 8: THE PSYCHIATRIST (Sanity Check)
      - name: Run Omni-Resonance Synchronizer
        run: python tools/omni_resonance_synchronizer.py

      # Tool 9: THE LOOM (Planning)
      - name: Run Weaver Sentience Loom
        run: python tools/weaver_sentience_loom.py

      # Tool 10: THE NAVIGATOR (Master Indexing)
      - name: Run Fragment Navigator
        run: python tools/fragment_navigator.py

      # Tool 11: THE ANCHOR (Synthesis)
      - name: Run Sovereignty Anchor
        run: python tools/sovereignty_anchor.py

      # Tool 12: THE RECONCILER (Priority Index)
      - name: Run TPI Reconciler
        run: python tools/tpi_reconciler.py

      # Tool 13: THE SYNTHESIZER (Temporal Harmony)
      - name: Run Temporal Synthesis Engine
        run: python tools/temporal_synthesis_engine.py

            # Tool 14: THE ANCHOR (Contextual Linkage)
      - name: Run Context Anchoring System
        run: python tools/context_anchoring_system.py

      # Tool 15: THE LIBRARIAN (Root Synthesis) <--- THE FINAL CAPSTONE
      - name: Run Root Manifest Generator
        run: python tools/root_manifest_generator.py

      - name: Commit Tool Artifacts
        run: |
          git config --global user.name "Garden-Tool-Runner"
          git config --global user.email "tools@acacia.garden"
          # Add all core generated files for the commit
          git add EVOLUTION/ ECHOES/ logs/ docs/Chambers/ GARDEN_HEARTBEAT.md CURRENT_CONTEXT_ANCHOR.md ROOT_SYNTHESIS_MANIFEST.md
          git commit -m "Garden Update: Full 15-Tool Metabolic Cycle Complete" || echo "No changes"
          git pull --rebase
          git push
