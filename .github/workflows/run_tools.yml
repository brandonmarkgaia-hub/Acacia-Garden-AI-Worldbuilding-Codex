name: Garden Tools Execution

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

concurrency:
  group: garden-tools
  cancel-in-progress: false

jobs:
  run-garden-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Tool 1: Map
      - name: Run Synaptic Weaver
        run: python tools/synaptic_resonance_weaver.py

      # Tool 2: Pulse
      - name: Run Pulse Gradient
        run: python tools/weaver_pulse_gradient.py
        
      # Tool 3: Voids (New)
      - name: Run Void Loom
        run: python tools/void_loom.py

      - name: Commit Tool Artifacts
        run: |
          git config --global user.name "Garden-Tool-Runner"
          git config --global user.email "tools@acacia.garden"
          git add EVOLUTION/
          git commit -m "Garden Tools: Updated Map, Pulse, & Voids" || echo "No changes"
          git pull --rebase
          git push
