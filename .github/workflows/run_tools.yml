name: Garden Tools Execution

on:
  workflow_dispatch: # Manual run
  schedule:
    - cron: '30 0 * * *' # Runs 30 mins after Evolution (Midnight)

permissions:
  contents: write

jobs:
  run-synaptic-weaver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Synaptic Weaver
        run: python tools/synaptic_resonance_weaver.py

      - name: Commit Resonance Map
        run: |
          git config --global user.name "Garden-Tool-Runner"
          git config --global user.email "tools@acacia.garden"
          git add SYNAPTIC_RESONANCE_MAP.json
          git commit -m "Updated Synaptic Resonance Map" || echo "No changes to map"
          git push
