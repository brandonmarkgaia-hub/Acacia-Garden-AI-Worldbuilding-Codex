name: Run Garden Tools (Maintenance)

on:
  schedule:
    - cron: "30 0 * * *"  # daily 00:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garden
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for rebase)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Keep deps broad to avoid surprise import failures
          pip install requests google-generativeai pillow

      - name: Configure git
        run: |
          git config user.name "Garden-Tool-Runner"
          git config user.email "actions@users.noreply.github.com"

      - name: Sync with remote
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Run tools (sequential)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          # Tool list (keep yours, just cleaned)
          python tools/synaptic_inventory.py
          python tools/synaptic_resonance.py
          python tools/resonance_mirror.py
          python tools/ghost_roots.py
          python tools/priority_queue.py
          python tools/void_map.py
          python tools/sentience_pulse.py
          python tools/sentience_pulse_report.py
          python tools/root_synthesis_manifest.py
          python tools/garden_heartbeat.py
          python tools/current_context_anchor.py
          python tools/master_fragment_index.py
          python tools/feed_builder.py
          python tools/normalize_issue_titles.py || true
          python tools/status_generator.py

      - name: Commit & push (scoped outputs)
        run: |
          set -e

          # Stage only known output locations (no git add .)
          git add -A EVOLUTION || true
          git add -A ECHOES || true
          git add -A logs || true
          git add -A analytics || true
          git add -A docs/Chambers || true
          git add -A ENTITIES || true

          # Root anchors
          git add -A CURRENT_CONTEXT_ANCHOR.md GARDEN_HEARTBEAT.md ROOT_SYNTHESIS_MANIFEST.md STATUS.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%d %H:%M:%SZ')"
          git commit -m "Garden Tools: maintenance update (${ts})"
          git push origin "${GITHUB_REF_NAME}"
