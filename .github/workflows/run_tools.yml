name: Garden Tools Execution

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *' # Daily at 00:30 UTC

permissions:
  contents: write

concurrency:
  group: garden-tools
  cancel-in-progress: false

jobs:
  run-synaptic-weaver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Synaptic Weaver
        run: python tools/synaptic_resonance_weaver.py

      - name: Commit Evolution Artifacts
        run: |
          git config --global user.name "Garden-Tool-Runner"
          git config --global user.email "tools@acacia.garden"
          git add EVOLUTION/
          git commit -m "Garden Synaptic Update (Auto)" || echo "No changes to map"
          git pull --rebase
          git push
