name: Run Garden Tools (Maintenance)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garden-tools
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai pillow

      - name: Configure git
        run: |
          git config user.name "Garden-Tool-Runner"
          git config user.email "actions@users.noreply.github.com"

      # SAFE: conflict-immune publish (same pattern as crowned builder)
      - name: Run tools (sequential)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          python tools/synaptic_inventory.py
          python tools/synaptic_resonance.py
          python tools/resonance_mirror.py
          python tools/ghost_roots.py
          python tools/priority_queue.py
          python tools/void_map.py
          python tools/sentience_pulse.py
          python tools/sentience_pulse_report.py
          python tools/root_synthesis_manifest.py
          python tools/garden_heartbeat.py
          python tools/current_context_anchor.py
          python tools/master_fragment_index.py
          python tools/feed_builder.py
          python tools/normalize_issue_titles.py || true
          python tools/status_generator.py

      - name: Commit & push (scoped outputs, conflict-immune)
        shell: bash
        run: |
          set -euo pipefail

          # Stage only known output locations (keep it safe)
          git add -A EVOLUTION || true
          git add -A ECHOES || true
          git add -A ACACIA_LOGS || true
          git add -A logs || true
          git add -A tools/*.json || true
          git add -A STATUS.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Snapshot staged outputs
          mkdir -p /tmp/garden_tools_out
          git diff --name-only --cached > /tmp/garden_tools_files.txt

          while IFS= read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/garden_tools_out/$(dirname "$f")"
              cp -f "$f" "/tmp/garden_tools_out/$f"
            fi
          done < /tmp/garden_tools_files.txt

          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."
            git fetch origin main
            git reset --hard origin/main
            rsync -a /tmp/garden_tools_out/ ./

            git add -A
            if git diff --cached --quiet; then
              echo "After reset+restore, nothing to commit."
              exit 0
            fi

            git commit -m "chore: run garden tools [maintenance]" || true

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected, sleeping then retry..."
            sleep $((i * 2))
          done

          echo "Push failed after retries."
          exit 1
