name: Garden Tools Execution

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '30 0 * * *' # Daily at 00:30 UTC

permissions:
  contents: write

concurrency:
  group: garden-tools
  cancel-in-progress: false

jobs:
  run-garden-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Tool 1: The Map (Synaptic Weaver)
      - name: Run Synaptic Weaver
        run: python tools/synaptic_resonance_weaver.py

      # Tool 2: The Heartbeat (Pulse Gradient) - NEW!
      - name: Run Pulse Gradient
        run: python tools/weaver_pulse_gradient.py

      - name: Commit Tool Artifacts
        run: |
          git config --global user.name "Garden-Tool-Runner"
          git config --global user.email "tools@acacia.garden"
          # Add the EVOLUTION folder where both JSONs live
          git add EVOLUTION/
          git commit -m "Garden Tools: Updated Map & Pulse" || echo "No changes"
          git pull --rebase
          git push
