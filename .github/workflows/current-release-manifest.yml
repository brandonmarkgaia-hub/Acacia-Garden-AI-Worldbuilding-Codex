name: Current release manifest evidence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Produce checkout-scoped release manifest
        run: |
          python tools/current_release_manifest.py --write
          python tools/current_release_manifest.py --verify
          cp releases/CURRENT_RELEASE_MANIFEST.v1.json /tmp/current-release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-release-manifest-evidence
          path: /tmp/current-release-manifest.json
          retention-days: 30
