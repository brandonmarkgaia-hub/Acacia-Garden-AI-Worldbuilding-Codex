name: Garden Evolution (Desire)

on:
  schedule:
    - cron: "0 0 * * *"   # daily 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garden
  cancel-in-progress: true

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for rebase)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Configure git
        run: |
          git config user.name "Garden-Tool-Runner"
          git config user.email "actions@users.noreply.github.com"

      - name: Sync with remote
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Generate Desire
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/garden_evolution.py

      - name: Commit & push (Desire only)
        run: |
          set -e
          # Stage ONLY today’s Desire file(s)
          git add -A EVOLUTION/Desire_*.md || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ts="$(date -u +'%Y-%m-%d %H:%M:%SZ')"
          git commit -m "Garden Evolution: desire update (${ts})"
          git push origin "${GITHUB_REF_NAME}"
