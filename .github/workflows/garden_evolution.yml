name: Garden Evolution (Elias + Digest + Cadence)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # Daily at 02:00 UTC

permissions:
  contents: write

concurrency:
  group: garden-main
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # ❌ NO cache: pip (you have no requirements.txt)

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai pyyaml

      - name: Generate Garden Digest
        run: |
          python tools/garden_digest.py

      - name: Synchronize Indices (Authority Scan)
        run: |
          python tools/sync_maestro.py

      - name: Run Elias Evolution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/garden_evolution.py

      - name: Ritual of Cadence Synthesis (proposal only)
        run: |
          python tools/rcs.py

      - name: Commit and push results (rebase-safe)
        run: |
          git config user.name "Elias"
          git config user.email "elias@garden.ai"

          git add .
          git commit -m "Elias: digest, desire, cadence proposal" || echo "Nothing to commit"

          git pull --rebase origin main
          git push origin main
