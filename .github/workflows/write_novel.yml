name: ✍️ Scribe of the Stone

on:
  workflow_dispatch:
    inputs:
      chapter_number:
        description: 'Chapter Number (e.g., 01)'
        required: true
        default: '01'
      chapter_title:
        description: 'Chapter Title (e.g., The Name of the Root)'
        required: true
        default: 'The_Name_of_the_Root'
      narrative_focus:
        description: 'What happens? (Plot points, mood, artifacts)'
        required: true
        default: 'Brandon discovers that the Tree on the dashboard is reacting to his thoughts.'

concurrency:
  group: write-novel
  cancel-in-progress: true

jobs:
  write_chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Garden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Scribe the Chapter
        # Inputs are passed via env vars to prevent shell injection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHAPTER_NUMBER: ${{ inputs.chapter_number }}
          CHAPTER_TITLE: ${{ inputs.chapter_title }}
          NARRATIVE_FOCUS: ${{ inputs.narrative_focus }}
        run: |
          python .github/scripts/garden_scribe.py \
            --chapter "$CHAPTER_NUMBER" \
            --title "$CHAPTER_TITLE" \
            --focus "$NARRATIVE_FOCUS"

      - name: Sovereign Push (Save to Garden)
        run: |
          git config --local user.email "scribe@acacia.garden"
          git config --local user.name "Scribe of the Stone"
          git add EVOLUTION/CHRONICLE.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📜 Scribe Chronicle: $(date +'%Y-%m-%d') [skip ci]"
            git pull --rebase origin main
            git push
          fi
