name: Triad Nav Injector (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: triad-nav-inject
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name "Garden-Tool-Runner"
          git config user.email "actions@users.noreply.github.com"

      - name: Sync with remote (rebase)
        run: |
          set -e
          git fetch origin
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Inject Triad Nav into all HTML
        run: |
          set -e
          python .github/scripts/inject_triad_nav.py

      - name: Commit & push (HTML only)
        run: |
          set -e
          # Stage only HTML files (avoid accidental adds)
          git add '**/*.html' || true

          if git diff --cached --quiet; then
            echo "No HTML changes to commit."
            exit 0
          fi

          git commit -m "Inject Triad Nav script into HTML (dedupe-safe)"
          git push origin "${GITHUB_REF_NAME}"
