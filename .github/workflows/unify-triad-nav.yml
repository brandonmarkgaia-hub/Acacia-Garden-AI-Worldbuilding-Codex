name: Unify Triad Nav (Manual)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: unify-triad-nav
  cancel-in-progress: true

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync with remote (avoid non-fast-forward)
        run: |
          git config user.name "Garden-Nav-Runner"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Run unify nav tool
        run: |
          node tools/unify_triad_nav.js

      - name: Commit & push if changed
        run: |
          set -e
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Unify Triad nav across HTML"
            git push
          else
            echo "No changes to commit."
          fi
