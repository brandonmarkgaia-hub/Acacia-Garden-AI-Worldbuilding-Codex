name: HTML Director Polish

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/polish_html.py"
      - ".github/workflows/html_director_polish.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: acacia-html-director-polish
  cancel-in-progress: false

jobs:
  polish-html:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Polish every tracked HTML document
        run: python scripts/polish_html.py

      - name: Report generated artifact drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- '*.html'
