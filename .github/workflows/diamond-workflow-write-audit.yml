name: Diamond workflow write audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/audit_workflow_writes.py'
      - 'tools/test_audit_workflow_writes.py'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - run: python -m unittest -v tools/test_audit_workflow_writes.py
      - run: python tools/audit_workflow_writes.py
