name: Build docs URL dump

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "docs/**"
      - ".github/scripts/build_docs_url_dump.py"

permissions:
  contents: write

concurrency:
  group: build-docs-url-dump
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build docs URL dump
        run: |
          python .github/scripts/build_docs_url_dump.py

      - name: Commit outputs (if any)
        run: |
          git config user.name "acacia-garden-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/docs_urls.html docs/docs_urls.json || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update docs URL dump"
          git push
