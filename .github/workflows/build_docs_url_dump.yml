name: Build docs URL dump (2026)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "**/*.html"
      - ".github/workflows/build-docs-url-dump.yml"
      - ".github/scripts/build_docs_url_dump.py"

permissions:
  contents: write

concurrency:
  group: build-docs-url-dump
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # prevent infinite loops on bot commits
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build docs URL dump
        run: python .github/scripts/build_docs_url_dump.py

      - name: Commit changes (if any)
        run: |
          git config user.name "docs-url-dump[bot]"
          git config user.email "docs-url-dump@users.noreply.github.com"
          git add docs/docs_urls.html docs/docs_urls.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(2026): rebuild docs URL dump [skip ci]"
          git push
