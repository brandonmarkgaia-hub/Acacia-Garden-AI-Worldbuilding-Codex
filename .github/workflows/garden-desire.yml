name: Garden Desire (Gemini)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  desire:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate Desire
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          python tools/garden_desire.py

      - name: Create PR (rebasesafe)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(desire): update EVOLUTION/DESIRE.md"
          title: "chore(desire): update EVOLUTION/DESIRE.md"
          body: |
            Automated Desire update generated via Gemini.
            - Source: tools/garden_desire.py
            - Output: EVOLUTION/DESIRE.md
            Keeper: HKX277206
          branch: "auton/desire"
          delete-branch: true
