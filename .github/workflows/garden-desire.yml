name: Garden Desire Proposal (Manual PR)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: garden-desire-proposal
  cancel-in-progress: true

jobs:
  desire:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Gemini SDK
        run: |
          python -m pip install --disable-pip-version-check "google-genai>=1,<2"

      - name: Generate Desire proposal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: |
          python tools/garden_desire.py

      - name: Verify proposal exists
        shell: bash
        run: |
          set -euo pipefail

          test -s EVOLUTION/DESIRE.md

          echo "Desire proposal generated."
          echo "No repository mutation has been authorized."

      - name: Create Keeper-review PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(desire): refresh witness proposal"
          title: "chore(desire): Garden witness proposal"
          body: |
            AI-generated Garden Desire proposal for Keeper review.

            This PR is non-authoritative by default.

            - Source: `tools/garden_desire.py`
            - Output: `EVOLUTION/DESIRE.md`
            - Mode: manual workflow dispatch
            - Execution: none
            - Canon status: none unless accepted by the Keeper

            The proposal may be accepted, edited, rejected, or left unmerged.
          branch: "proposal/garden-desire"
          base: "main"
          delete-branch: true
          add-paths: |
            EVOLUTION/DESIRE.md
