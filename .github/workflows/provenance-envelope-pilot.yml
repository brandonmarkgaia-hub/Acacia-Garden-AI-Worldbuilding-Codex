name: Provenance envelope pilot (advisory)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/retrieval_envelope.py'
      - 'tools/test_retrieval_envelope.py'
      - 'tools/retrieval_manifest.advisory.json'
      - '.github/workflows/provenance-envelope-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envelope-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest -v tools/test_retrieval_envelope.py
      - name: Generate real-source envelopes
        run: |
          python tools/retrieval_envelope.py --root . --manifest tools/retrieval_manifest.advisory.json > provenance-envelope-pilot.jsonl
      - name: Check generated source slices and classification boundaries
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          lines = Path('provenance-envelope-pilot.jsonl').read_text(encoding='utf-8').splitlines()
          assert lines, 'No envelopes produced'
          paths = set()
          for line in lines:
              row = json.loads(line)
              paths.add(row['source_path'])
              text = Path(row['source_path']).read_text(encoding='utf-8')
              part = text[row['start_offset']:row['end_offset']]
              sha = lambda s: hashlib.sha256(s.encode('utf-8')).hexdigest()
              assert row['text'] == part
              assert row['source_sha256'] == sha(text)
              assert row['chunk_sha256'] == sha(part)
              assert row['schema'] == 'acacia.retrieval-envelope/0.2-advisory'
          assert len(paths) == 3, paths
          print(f'Verified {len(lines)} exact source windows across {len(paths)} documents')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: provenance-envelope-pilot
          path: provenance-envelope-pilot.jsonl
          retention-days: 30
