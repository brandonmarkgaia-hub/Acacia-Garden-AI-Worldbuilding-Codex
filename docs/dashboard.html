<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acacia Garden · Dashboard Redirect</title>
  <meta name="description" content="Compatibility doorway from the former docs dashboard to the current Acacia Garden dashboard." />
  <meta http-equiv="refresh" content="0; url=../dashboard.html" />
  <link rel="canonical" href="../dashboard.html" />
  <script>
    (function () {
      var target = "../dashboard.html";
      if (window.location.search) target += window.location.search;
      if (window.location.hash) target += window.location.hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Dashboard moved</h1>
    <p>This compatibility route now points to the maintained root dashboard.</p>
